<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Verify This!">
  <!-- Verify This! — el favicon del curso. A mano, sin generador.
       La V de "Verify" dibujada con la asimetria de un tilde de verificacion
       (brazo corto que baja, brazo largo que sube): el mismo trazo dice la
       inicial del curso y "verificado". El ! blanco es el signo del titulo.
       Dos formas gruesas y tres colores: a 16 px no queda nada que perder. -->
  <rect width="32" height="32" rx="7" fill="#111"/>
  <path d="M5.5 13.5 12.2 23.5 19.8 5.5" fill="none" stroke="#e7ad52" stroke-width="5"/>
  <rect x="23" y="6.8" width="5" height="11.2" fill="#f0f0f0"/>
  <rect x="23" y="20.4" width="5" height="4.8" fill="#f0f0f0"/>
</svg>
