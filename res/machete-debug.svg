<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Machete de debug: las siete perillas del curso y qué mirar según el síntoma</title>

<text x="24" y="34" fill="#e7ad52" font-size="26" font-family="IBM Plex Mono, ui-monospace, monospace">Caja de debug</text>
<text x="876" y="34" fill="#5f5f5f" font-size="15" text-anchor="end">cinco son plusargs: no se recompila</text>
<line x1="24" y1="50" x2="876" y2="50" stroke="#444444" stroke-width="2"/>

<!-- las siete herramientas -->
<text x="24"  y="86" fill="#74e685" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">VLT_TRACE=1</text>
<text x="360" y="86" fill="#f0f0f0" font-size="17">las señales de verdad, en GTKWave</text>
<text x="876" y="86" fill="#5f5f5f" font-size="15" text-anchor="end">cap. 1</text>
<line x1="24" y1="100" x2="876" y2="100" stroke="#2e2e2e" stroke-width="1"/>

<text x="24"  y="132" fill="#74e685" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">+UVM_VERBOSITY=UVM_HIGH</text>
<text x="360" y="132" fill="#f0f0f0" font-size="17">lo que los monitores dicen que vieron</text>
<text x="876" y="132" fill="#5f5f5f" font-size="15" text-anchor="end">cap. 19</text>
<line x1="24" y1="146" x2="876" y2="146" stroke="#2e2e2e" stroke-width="1"/>

<text x="24"  y="178" fill="#74e685" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">+UVM_CONFIG_DB_TRACE</text>
<text x="360" y="178" fill="#f0f0f0" font-size="17">quién puso qué, y quién lo leyó</text>
<text x="876" y="178" fill="#5f5f5f" font-size="15" text-anchor="end">cap. 22</text>
<line x1="24" y1="192" x2="876" y2="192" stroke="#2e2e2e" stroke-width="1"/>

<text x="24"  y="224" fill="#74e685" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">+TOPOLOGY</text>
<text x="360" y="224" fill="#f0f0f0" font-size="17">el árbol que UVM armó de verdad</text>
<text x="876" y="224" fill="#5f5f5f" font-size="15" text-anchor="end">cap. 22</text>
<line x1="24" y1="238" x2="876" y2="238" stroke="#2e2e2e" stroke-width="1"/>

<text x="24"  y="270" fill="#74e685" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">+UVM_OBJECTION_TRACE</text>
<text x="360" y="270" fill="#f0f0f0" font-size="17">quién la levantó y quién la bajó</text>
<text x="876" y="270" fill="#5f5f5f" font-size="15" text-anchor="end">cap. 11</text>
<line x1="24" y1="284" x2="876" y2="284" stroke="#2e2e2e" stroke-width="1"/>

<text x="24"  y="316" fill="#74e685" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">+UVM_TIMEOUT=5000000,NO</text>
<text x="360" y="316" fill="#f0f0f0" font-size="17">un techo para el cuelgue</text>
<text x="876" y="316" fill="#5f5f5f" font-size="15" text-anchor="end">cap. 11</text>
<line x1="24" y1="330" x2="876" y2="330" stroke="#2e2e2e" stroke-width="1"/>

<text x="24"  y="362" fill="#74e685" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">+UVM_MAX_QUIT_COUNT=N</text>
<text x="360" y="362" fill="#f0f0f0" font-size="17">matar la corrida al N-ésimo error</text>
<text x="876" y="362" fill="#5f5f5f" font-size="15" text-anchor="end">cap. 19</text>

<!-- por sintoma -->
<line x1="24" y1="394" x2="876" y2="394" stroke="#444444" stroke-width="2"/>
<text x="24" y="428" fill="#e7ad52" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">Según el síntoma</text>

<text x="24"  y="466" fill="#f0f0f0" font-size="17">termina en t=0 y dice PASS</text>
<text x="470" y="466" fill="#8d8d8d" font-size="17">→</text>
<text x="504" y="466" fill="#74e685" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">+UVM_OBJECTION_TRACE</text>

<text x="24"  y="502" fill="#f0f0f0" font-size="17">no termina nunca</text>
<text x="470" y="502" fill="#8d8d8d" font-size="17">→</text>
<text x="504" y="502" fill="#74e685" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">+UVM_TIMEOUT=5000000,NO</text>

<text x="24"  y="538" fill="#f0f0f0" font-size="17">el scoreboard grita en todas</text>
<text x="470" y="538" fill="#8d8d8d" font-size="17">→</text>
<text x="504" y="538" fill="#74e685" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">+UVM_VERBOSITY=UVM_HIGH</text>

<text x="24"  y="574" fill="#f0f0f0" font-size="17">el config_db no encuentra</text>
<text x="470" y="574" fill="#8d8d8d" font-size="17">→</text>
<text x="504" y="574" fill="#74e685" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">+UVM_CONFIG_DB_TRACE</text>

<text x="24"  y="610" fill="#f0f0f0" font-size="17">la cobertura da 0 %</text>
<text x="470" y="610" fill="#8d8d8d" font-size="17">→</text>
<text x="504" y="610" fill="#74e685" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">falta new() o sample()</text>

<text x="24"  y="646" fill="#f0f0f0" font-size="17">el árbol no es el que dibujaste</text>
<text x="470" y="646" fill="#8d8d8d" font-size="17">→</text>
<text x="504" y="646" fill="#74e685" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">+TOPOLOGY</text>

<rect x="1" y="1" width="898" height="666" rx="6" fill="none" stroke="#5b6b7a" stroke-width="2"/>
</svg>
