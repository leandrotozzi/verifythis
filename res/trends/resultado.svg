<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Cómo terminan los proyectos IC/ASIC (2024)</title>
<text x="40" y="46" fill="#f0f0f0" font-size="34" font-weight="600">Cómo terminan los proyectos IC/ASIC</text>
<text x="40" y="76" fill="#8d8d8d" font-size="21">IC/ASIC, 2024</text>
<text x="354" y="117" fill="#f0f0f0" font-size="22" text-anchor="end">Éxito en el primer silicio</text>
<rect x="370" y="96" width="440" height="30" fill="#ffffff" opacity="0.06" rx="3"/>
<rect x="370" y="96" width="62" height="30" fill="#e7ad52" rx="3"/>
<text x="444" y="119" fill="#e7ad52" font-size="24" font-weight="600">14%</text>
<text x="354" y="179" fill="#f0f0f0" font-size="22" text-anchor="end">Proyectos atrasados</text>
<rect x="370" y="158" width="440" height="30" fill="#ffffff" opacity="0.06" rx="3"/>
<rect x="370" y="158" width="330" height="30" fill="#5b6b7a" rx="3"/>
<text x="712" y="181" fill="#f0f0f0" font-size="24" font-weight="600">75%</text>
<text x="40" y="238" fill="#8d8d8d" font-size="19">14% es el valor más bajo en 20 años de encuesta. Atrasados: 75%, contra 66% histórico.</text>
<text x="40" y="268" fill="#8d8d8d" font-size="16">Datos: Wilson Research Group / Siemens EDA, estudio 2024. Gráfico propio.</text>
</svg>
