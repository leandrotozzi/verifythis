<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 558" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Qué tienen adentro los IC/ASIC de hoy (2024)</title>
<text x="40" y="46" fill="#f0f0f0" font-size="34" font-weight="600">Qué tienen adentro los IC/ASIC de hoy</text>
<text x="40" y="76" fill="#8d8d8d" font-size="21">IC/ASIC, 2024</text>
<text x="354" y="117" fill="#f0f0f0" font-size="22" text-anchor="end">2 o más relojes asincrónicos</text>
<rect x="370" y="96" width="440" height="30" fill="#ffffff" opacity="0.06" rx="3"/>
<rect x="370" y="96" width="418" height="30" fill="#e7ad52" rx="3"/>
<text x="800" y="119" fill="#e7ad52" font-size="24" font-weight="600">95%</text>
<text x="354" y="179" fill="#f0f0f0" font-size="22" text-anchor="end">Procesador embebido</text>
<rect x="370" y="158" width="440" height="30" fill="#ffffff" opacity="0.06" rx="3"/>
<rect x="370" y="158" width="370" height="30" fill="#5b6b7a" rx="3"/>
<text x="752" y="181" fill="#f0f0f0" font-size="24" font-weight="600">84%</text>
<text x="354" y="241" fill="#f0f0f0" font-size="22" text-anchor="end">Funciones de seguridad</text>
<rect x="370" y="220" width="440" height="30" fill="#ffffff" opacity="0.06" rx="3"/>
<rect x="370" y="220" width="365" height="30" fill="#5b6b7a" rx="3"/>
<text x="747" y="243" fill="#f0f0f0" font-size="24" font-weight="600">83%</text>
<text x="354" y="303" fill="#f0f0f0" font-size="22" text-anchor="end">Acelerador de IA</text>
<rect x="370" y="282" width="440" height="30" fill="#ffffff" opacity="0.06" rx="3"/>
<rect x="370" y="282" width="260" height="30" fill="#5b6b7a" rx="3"/>
<text x="642" y="305" fill="#f0f0f0" font-size="24" font-weight="600">59%</text>
<text x="354" y="365" fill="#f0f0f0" font-size="22" text-anchor="end">RISC-V</text>
<rect x="370" y="344" width="440" height="30" fill="#ffffff" opacity="0.06" rx="3"/>
<rect x="370" y="344" width="255" height="30" fill="#5b6b7a" rx="3"/>
<text x="637" y="367" fill="#f0f0f0" font-size="24" font-weight="600">58%</text>
<text x="354" y="427" fill="#f0f0f0" font-size="22" text-anchor="end">Norma de safety</text>
<rect x="370" y="406" width="440" height="30" fill="#ffffff" opacity="0.06" rx="3"/>
<rect x="370" y="406" width="194" height="30" fill="#5b6b7a" rx="3"/>
<text x="576" y="429" fill="#f0f0f0" font-size="24" font-weight="600">44%</text>
<text x="40" y="486" fill="#8d8d8d" font-size="19">RISC-V casi duplicó respecto del estudio anterior; los aceleradores de IA pasaron de</text>
<text x="40" y="510" fill="#8d8d8d" font-size="19">~30% a 59%.</text>
<text x="40" y="540" fill="#8d8d8d" font-size="16">Datos: Wilson Research Group / Siemens EDA, estudio 2024. Gráfico propio.</text>
</svg>
