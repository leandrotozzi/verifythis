<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>The UVM base class hierarchy</title>

<g fill="none" stroke="#5b6b7a" stroke-width="2">
  <path d="M450,68 V94"/>
  <path d="M450,140 V154 M240,154 H660 M240,154 V168 M660,154 V168"/>
  <path d="M240,214 V238"/>
  <path d="M660,214 V238"/>
  <path d="M240,284 V376"/>
  <path d="M135,302 H765"/>
  <path d="M135,302 V316 M345,302 V316 M555,302 V316 M765,302 V316"/>
  <path d="M135,376 H765"/>
  <path d="M135,376 V390 M345,376 V390 M765,376 V390"/>
  <path d="M555,376 V390" stroke-dasharray="6 5"/>
</g>

<rect x="360" y="22" width="180" height="46" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="450" y="54" text-anchor="middle" fill="#f0f0f0" font-size="25">uvm_void</text>

<rect x="340" y="94" width="220" height="46" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="450" y="126" text-anchor="middle" fill="#f0f0f0" font-size="25">uvm_object</text>

<rect x="105" y="168" width="270" height="46" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="240" y="200" text-anchor="middle" fill="#f0f0f0" font-size="25">uvm_report_object</text>

<rect x="105" y="238" width="270" height="46" rx="4" fill="#e7ad52" fill-opacity="0.12" stroke="#e7ad52" stroke-width="2"/>
<text x="240" y="270" text-anchor="middle" fill="#e7ad52" font-size="25">uvm_component</text>

<rect x="525" y="168" width="270" height="46" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="660" y="200" text-anchor="middle" fill="#f0f0f0" font-size="25">uvm_transaction</text>

<rect x="525" y="238" width="270" height="46" rx="4" fill="#e7ad52" fill-opacity="0.12" stroke="#e7ad52" stroke-width="2"/>
<text x="660" y="270" text-anchor="middle" fill="#e7ad52" font-size="25">uvm_sequence_item</text>

<rect x="40" y="316" width="190" height="44" rx="4" fill="#e7ad52" fill-opacity="0.12" stroke="#e7ad52" stroke-width="2"/>
<text x="135" y="345" text-anchor="middle" fill="#e7ad52" font-size="20">uvm_test</text>

<rect x="250" y="316" width="190" height="44" rx="4" fill="#e7ad52" fill-opacity="0.12" stroke="#e7ad52" stroke-width="2"/>
<text x="345" y="345" text-anchor="middle" fill="#e7ad52" font-size="20">uvm_env</text>

<rect x="460" y="316" width="190" height="44" rx="4" fill="#e7ad52" fill-opacity="0.12" stroke="#e7ad52" stroke-width="2"/>
<text x="555" y="345" text-anchor="middle" fill="#e7ad52" font-size="20">uvm_agent</text>

<rect x="670" y="316" width="190" height="44" rx="4" fill="#e7ad52" fill-opacity="0.12" stroke="#e7ad52" stroke-width="2"/>
<text x="765" y="345" text-anchor="middle" fill="#e7ad52" font-size="20">uvm_scoreboard</text>

<rect x="40" y="390" width="190" height="44" rx="4" fill="#e7ad52" fill-opacity="0.12" stroke="#e7ad52" stroke-width="2"/>
<text x="135" y="419" text-anchor="middle" fill="#e7ad52" font-size="20">uvm_driver</text>

<rect x="250" y="390" width="190" height="44" rx="4" fill="#e7ad52" fill-opacity="0.12" stroke="#e7ad52" stroke-width="2"/>
<text x="345" y="419" text-anchor="middle" fill="#e7ad52" font-size="20">uvm_monitor</text>

<rect x="460" y="390" width="190" height="44" rx="4" fill="#74e685" fill-opacity="0.12" stroke="#74e685" stroke-width="2"/>
<text x="555" y="419" text-anchor="middle" fill="#74e685" font-size="20">uvm_sequencer</text>
<text x="555" y="456" text-anchor="middle" fill="#8d8d8d" font-size="16">via uvm_sequencer_base</text>

<rect x="670" y="390" width="190" height="44" rx="4" fill="#e7ad52" fill-opacity="0.12" stroke="#e7ad52" stroke-width="2"/>
<text x="765" y="419" text-anchor="middle" fill="#e7ad52" font-size="20">uvm_subscriber</text>

<rect x="40" y="471" width="18" height="18" rx="3" fill="#e7ad52"/>
<text x="68" y="486" fill="#8d8d8d" font-size="18">you extend these</text>
<rect x="250" y="471" width="18" height="18" rx="3" fill="#74e685"/>
<text x="278" y="486" fill="#8d8d8d" font-size="18">as is, with a typedef</text>
<rect x="490" y="471" width="18" height="18" rx="3" fill="#5b6b7a"/>
<text x="518" y="486" fill="#8d8d8d" font-size="18">you only inherit these</text>
</svg>
