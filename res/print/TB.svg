<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 484" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Anatomía de un testbench SystemVerilog</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
  </marker>
</defs>

<!-- contenedores -->
<rect x="32" y="44" width="836" height="266" rx="4" fill="none" stroke="#d0d3d8" stroke-width="2"/>
<text x="46" y="66" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">module top</text>

<rect x="52" y="72" width="796" height="228" rx="4" fill="none" stroke="#d0d3d8" stroke-width="2"/>
<text x="66" y="94" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">class testbench</text>

<!-- tester -->
<rect x="96" y="134" width="168" height="58" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="180" y="161" text-anchor="middle" fill="#16181d" font-size="22" font-weight="600">tester</text>
<text x="180" y="183" text-anchor="middle" fill="#5a6068" font-size="16">genera estímulos</text>

<!-- driver -->
<rect x="96" y="220" width="168" height="58" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="180" y="247" text-anchor="middle" fill="#16181d" font-size="22" font-weight="600">driver / BFM</text>
<text x="180" y="269" text-anchor="middle" fill="#5a6068" font-size="16">maneja los pines</text>

<!-- monitor -->
<rect x="300" y="220" width="150" height="58" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="375" y="247" text-anchor="middle" fill="#16181d" font-size="22" font-weight="600">monitor</text>
<text x="375" y="269" text-anchor="middle" fill="#5a6068" font-size="16">muestrea pines</text>

<!-- scoreboard -->
<rect x="640" y="134" width="190" height="58" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="735" y="161" text-anchor="middle" fill="#16181d" font-size="22" font-weight="600">scoreboard</text>
<text x="735" y="183" text-anchor="middle" fill="#5a6068" font-size="16">modelo de referencia</text>

<!-- coverage -->
<rect x="640" y="220" width="190" height="58" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="735" y="247" text-anchor="middle" fill="#16181d" font-size="22" font-weight="600">coverage</text>
<text x="735" y="269" text-anchor="middle" fill="#5a6068" font-size="16">covergroups</text>

<!-- conexiones internas -->
<path d="M180,192 V216" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<path d="M450,249 H560" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<path d="M560,249 V163 H636" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<path d="M560,249 H636" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<circle cx="560" cy="249" r="4" fill="#5b6b7a"/>
<text x="735" y="212" text-anchor="middle" fill="#5a6068" font-size="16">handle compartido</text>

<!-- bajada al RTL -->
<path d="M180,278 V338" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<path d="M375,342 V282" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<text x="192" y="324" fill="#5a6068" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace">virtual vtalu_bfm</text>

<!-- interface: lo que la slide quiere que mires -->
<rect x="60" y="342" width="780" height="30" rx="4" fill="#b0761d" fill-opacity="0.10" stroke="#b0761d" stroke-width="2"/>
<text x="450" y="364" text-anchor="middle" fill="#b0761d" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace">interface vtalu_bfm</text>

<path d="M400,372 V388" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<path d="M500,388 V376" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>

<!-- DUT -->
<rect x="300" y="392" width="300" height="56" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="450" y="419" text-anchor="middle" fill="#16181d" font-size="22" font-weight="600">DUT — vtalu</text>
<text x="450" y="440" text-anchor="middle" fill="#5a6068" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace">A, B, op → result, done</text>

<text x="32" y="474" fill="#5a6068" font-size="17">La interface es la frontera: de un lado clases y transacciones, del otro pines y RTL.</text>
</svg>
