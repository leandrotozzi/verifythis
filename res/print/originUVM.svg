<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="IBM Plex Sans, system-ui, sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
  </marker>
</defs>

<!-- eRM -->
<rect x="40" y="64" width="140" height="62" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="110" y="93" text-anchor="middle" fill="#16181d" font-size="24" font-weight="600">eRM</text>
<text x="110" y="115" text-anchor="middle" fill="#5a6068" font-size="16">Verisity, 2002</text>

<!-- RVM -->
<rect x="40" y="236" width="140" height="62" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="110" y="265" text-anchor="middle" fill="#16181d" font-size="24" font-weight="600">RVM</text>
<text x="110" y="287" text-anchor="middle" fill="#5a6068" font-size="16">Synopsys, 2003</text>

<!-- URM -->
<rect x="220" y="64" width="140" height="62" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="290" y="93" text-anchor="middle" fill="#16181d" font-size="24" font-weight="600">URM</text>
<text x="290" y="115" text-anchor="middle" fill="#5a6068" font-size="16">Cadence, 2007</text>

<!-- AVM -->
<rect x="220" y="150" width="140" height="62" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="290" y="179" text-anchor="middle" fill="#16181d" font-size="24" font-weight="600">AVM</text>
<text x="290" y="201" text-anchor="middle" fill="#5a6068" font-size="16">Mentor, 2006</text>

<!-- VMM -->
<rect x="220" y="236" width="140" height="62" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="290" y="265" text-anchor="middle" fill="#16181d" font-size="24" font-weight="600">VMM</text>
<text x="290" y="287" text-anchor="middle" fill="#5a6068" font-size="16">Synopsys, 2005</text>

<!-- OVM -->
<rect x="400" y="150" width="200" height="62" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="500" y="179" text-anchor="middle" fill="#16181d" font-size="24" font-weight="600">OVM</text>
<text x="500" y="201" text-anchor="middle" fill="#5a6068" font-size="16">Cadence + Mentor, 2008</text>

<!-- UVM (destino, acento) -->
<rect x="640" y="124" width="220" height="114" rx="4" fill="#b0761d" fill-opacity="0.10" stroke="#b0761d" stroke-width="2"/>
<text x="750" y="166" text-anchor="middle" fill="#b0761d" font-size="30" font-weight="600">UVM</text>
<text x="750" y="196" text-anchor="middle" fill="#16181d" font-size="19">Accellera, 2011</text>
<text x="750" y="222" text-anchor="middle" fill="#5a6068" font-size="17">IEEE 1800.2-2020</text>

<!-- flechas -->
<path d="M180,95 H216" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<path d="M180,267 H216" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<path d="M360,95 H500 V146" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<path d="M360,181 H396" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<path d="M600,181 H636" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<path d="M290,298 V332 H720 V240" fill="none" stroke="#5b6b7a" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a)"/>
<text x="505" y="324" text-anchor="middle" fill="#5a6068" font-size="17">inspiración</text>

<text x="40" y="372" fill="#5a6068" font-size="17">OVM (2008) fusionó AVM de Mentor con URM de Cadence; Accellera tomó OVM 2.1.1 como base de UVM.</text>
<text x="40" y="398" fill="#5a6068" font-size="17">VMM aportó ideas, no código. IEEE estandarizó UVM en 1800.2-2017 y luego en 1800.2-2020.</text>
</svg>
