<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Adónde se va el tiempo (2024)</title>
<text x="40" y="46" fill="#16181d" font-size="34" font-weight="600">Adónde se va el tiempo</text>
<text x="40" y="76" fill="#5a6068" font-size="21">IC/ASIC, 2024</text>
<text x="354" y="103" fill="#16181d" font-size="22" text-anchor="end">Del tiempo del diseñador,</text>
<text x="354" y="127" fill="#16181d" font-size="22" text-anchor="end">en verificación</text>
<rect x="370" y="96" width="440" height="30" fill="#16181d" opacity="0.06" rx="3"/>
<rect x="370" y="96" width="216" height="30" fill="#5b6b7a" rx="3"/>
<text x="598" y="119" fill="#16181d" font-size="24" font-weight="600">49%</text>
<text x="354" y="165" fill="#16181d" font-size="22" text-anchor="end">Del tiempo del verificador,</text>
<text x="354" y="189" fill="#16181d" font-size="22" text-anchor="end">en debug</text>
<rect x="370" y="158" width="440" height="30" fill="#16181d" opacity="0.06" rx="3"/>
<rect x="370" y="158" width="207" height="30" fill="#b0761d" rx="3"/>
<text x="589" y="181" fill="#b0761d" font-size="24" font-weight="600">47%</text>
<text x="40" y="238" fill="#5a6068" font-size="19">En proyectos de procesadores la relación verificación:diseño llega a 5 a 1.</text>
<text x="40" y="268" fill="#5a6068" font-size="16">Datos: Wilson Research Group / Siemens EDA, estudio 2024. Gráfico propio.</text>
</svg>
