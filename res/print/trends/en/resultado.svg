<text x="354" y="117" fill="#16181d" font-size="22" text-anchor="end">First-silicon success</text>
<rect x="370" y="96" width="440" height="30" fill="#16181d" opacity="0.06" rx="3"/>
<rect x="370" y="96" width="62" height="30" fill="#b0761d" rx="3"/>
<text x="444" y="119" fill="#b0761d" font-size="24" font-weight="600">14%</text>
<text x="354" y="179" fill="#16181d" font-size="22" text-anchor="end">Projects behind schedule</text>
