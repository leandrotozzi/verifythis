<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Where the time goes (2024)</title>
<text x="40" y="46" fill="#16181d" font-size="34" font-weight="600">Where the time goes</text>
<text x="40" y="76" fill="#5a6068" font-size="21">IC/ASIC, 2024</text>
<text x="354" y="103" fill="#16181d" font-size="22" text-anchor="end">Of the designer's time,</text>
<text x="354" y="127" fill="#16181d" font-size="22" text-anchor="end">on verification</text>
<rect x="370" y="96" width="440" height="30" fill="#16181d" opacity="0.06" rx="3"/>
<rect x="370" y="96" width="216" height="30" fill="#5b6b7a" rx="3"/>
<text x="598" y="119" fill="#16181d" font-size="24" font-weight="600">49%</text>
<text x="354" y="165" fill="#16181d" font-size="22" text-anchor="end">Of the verifier's time,</text>
<text x="354" y="189" fill="#16181d" font-size="22" text-anchor="end">on debug</text>
<rect x="370" y="158" width="440" height="30" fill="#16181d" opacity="0.06" rx="3"/>
<rect x="370" y="158" width="207" height="30" fill="#b0761d" rx="3"/>
<text x="589" y="181" fill="#b0761d" font-size="24" font-weight="600">47%</text>
<text x="40" y="238" fill="#5a6068" font-size="19">On processor projects the verification:design ratio reaches 5 to 1.</text>
<text x="40" y="268" fill="#5a6068" font-size="16">Data: Wilson Research Group / Siemens EDA, 2024 study. Own chart.</text>
</svg>
