<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 558" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>What today's IC/ASIC have inside (2024)</title>
<text x="40" y="46" fill="#16181d" font-size="34" font-weight="600">What today's IC/ASIC have inside</text>
<text x="40" y="76" fill="#5a6068" font-size="21">IC/ASIC, 2024</text>
<text x="354" y="117" fill="#16181d" font-size="22" text-anchor="end">2 or more asynchronous clocks</text>
<rect x="370" y="96" width="440" height="30" fill="#16181d" opacity="0.06" rx="3"/>
<rect x="370" y="96" width="418" height="30" fill="#b0761d" rx="3"/>
<text x="800" y="119" fill="#b0761d" font-size="24" font-weight="600">95%</text>
<text x="354" y="179" fill="#16181d" font-size="22" text-anchor="end">Embedded processor</text>
<rect x="370" y="158" width="440" height="30" fill="#16181d" opacity="0.06" rx="3"/>
<rect x="370" y="158" width="370" height="30" fill="#5b6b7a" rx="3"/>
<text x="752" y="181" fill="#16181d" font-size="24" font-weight="600">84%</text>
<text x="354" y="241" fill="#16181d" font-size="22" text-anchor="end">Security functions</text>
<rect x="370" y="220" width="440" height="30" fill="#16181d" opacity="0.06" rx="3"/>
<rect x="370" y="220" width="365" height="30" fill="#5b6b7a" rx="3"/>
<text x="747" y="243" fill="#16181d" font-size="24" font-weight="600">83%</text>
<text x="354" y="303" fill="#16181d" font-size="22" text-anchor="end">AI accelerator</text>
<rect x="370" y="282" width="440" height="30" fill="#16181d" opacity="0.06" rx="3"/>
<rect x="370" y="282" width="260" height="30" fill="#5b6b7a" rx="3"/>
<text x="642" y="305" fill="#16181d" font-size="24" font-weight="600">59%</text>
<text x="354" y="365" fill="#16181d" font-size="22" text-anchor="end">RISC-V</text>
<rect x="370" y="344" width="440" height="30" fill="#16181d" opacity="0.06" rx="3"/>
<rect x="370" y="344" width="255" height="30" fill="#5b6b7a" rx="3"/>
<text x="637" y="367" fill="#16181d" font-size="24" font-weight="600">58%</text>
<text x="354" y="427" fill="#16181d" font-size="22" text-anchor="end">Safety standard</text>
<rect x="370" y="406" width="440" height="30" fill="#16181d" opacity="0.06" rx="3"/>
<rect x="370" y="406" width="194" height="30" fill="#5b6b7a" rx="3"/>
<text x="576" y="429" fill="#16181d" font-size="24" font-weight="600">44%</text>
<text x="40" y="486" fill="#5a6068" font-size="19">RISC-V nearly doubled since the previous study; AI accelerators went from ~30% to 59%.</text>
<text x="40" y="516" fill="#5a6068" font-size="16">Datos: Wilson Research Group / Siemens EDA, 2024 study. Gráfico propio.</text>
</svg>
