<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 444" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Anatomía de la línea tipo::type_id::create(nombre, this)</title>
<!-- llamadas de arriba -->
<path d="M753,170 H806" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<path d="M780,170 V64" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="766" y="70" text-anchor="end" fill="#5a6068" font-size="18">el padre en la jerarquía</text>

<path d="M357,170 H582" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<path d="M470,170 V124" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="456" y="108" text-anchor="end" fill="#5a6068" font-size="18">lo agrega la macro `uvm_component_utils</text>
<text x="456" y="130" text-anchor="end" fill="#5a6068" font-size="18">y devuelve el tipo justo, sin castear</text>

<text x="67" y="190" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace" xml:space="preserve"><tspan fill="#b0761d">tester_h</tspan><tspan fill="#16181d"> = </tspan><tspan fill="#b0761d">base_tester</tspan><tspan fill="#16181d">::type_id::create(</tspan><tspan fill="#b0761d">"tester_h"</tspan><tspan fill="#16181d">, this);</tspan></text>

<!-- llamadas de abajo -->
<path d="M595,212 H727" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<path d="M661,212 V244" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="647" y="250" text-anchor="end" fill="#5a6068" font-size="18">el nombre de la instancia:</text>
<text x="647" y="272" text-anchor="end" fill="#5a6068" font-size="18">es el que ves en el path UVM</text>

<path d="M212,212 H357" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<path d="M285,212 V318" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="299" y="324" fill="#5a6068" font-size="18">qué tipo le pedís a la factory</text>

<path d="M67,212 H173" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<path d="M120,212 V372" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="134" y="378" fill="#5a6068" font-size="18">la variable que lo guarda, declarada como base_tester</text>

<text x="40" y="424" fill="#5a6068" font-size="17">En ámbar, lo único que cambia de una línea a otra; el resto es siempre igual.</text>
</svg>
