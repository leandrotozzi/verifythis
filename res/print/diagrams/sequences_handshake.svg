<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 76 900 444" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Handshake entre la sequence y el driver: start_item, get_next_item, item_done y finish_item</title>
<defs>
  <marker id="h-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
  </marker>
  <marker id="h-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#b0761d"/>
  </marker>
</defs>

<!-- verticales de los eventos -->
<g stroke="#dfe2e6" stroke-width="1" stroke-dasharray="2 5">
  <path d="M210,84 V404"/>
  <path d="M350,84 V404"/>
  <path d="M500,84 V404"/>
  <path d="M540,84 V404"/>
  <path d="M790,84 V404"/>
</g>

<!-- ================= carril de la sequence ================= -->
<text x="176" y="110" text-anchor="end" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">reset_sequence</text>
<text x="176" y="131" text-anchor="end" fill="#5a6068" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace">body()</text>

<rect x="210" y="90" width="140" height="42" rx="3" fill="#16181d" opacity="0.04"/>
<rect x="210" y="90" width="140" height="42" rx="3" fill="none" stroke="#5b6b7a" stroke-width="2" stroke-dasharray="5 4"/>
<text x="280" y="117" text-anchor="middle" fill="#5a6068" font-size="15">bloqueada</text>

<rect x="350" y="90" width="150" height="42" rx="3" fill="#b0761d" opacity="0.14"/>
<rect x="350" y="90" width="150" height="42" rx="3" fill="none" stroke="#b0761d" stroke-width="2"/>
<text x="425" y="109" text-anchor="middle" fill="#b0761d" font-size="14">llena el item</text>
<text x="425" y="126" text-anchor="middle" fill="#b0761d" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace">randomize()</text>

<rect x="500" y="90" width="290" height="42" rx="3" fill="#16181d" opacity="0.04"/>
<rect x="500" y="90" width="290" height="42" rx="3" fill="none" stroke="#5b6b7a" stroke-width="2" stroke-dasharray="5 4"/>
<text x="645" y="117" text-anchor="middle" fill="#5a6068" font-size="15">bloqueada</text>

<path d="M796,111 H862" fill="none" stroke="#b0761d" stroke-width="2" marker-end="url(#h-a)"/>
<text x="798" y="102" fill="#b0761d" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace">cmd.result</text>

<!-- ================= banda del sequencer ================= -->
<text x="176" y="228" text-anchor="end" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">sequencer_h</text>
<text x="176" y="249" text-anchor="end" fill="#5a6068" font-size="15">arbitra</text>
<rect x="190" y="204" width="670" height="52" rx="4" fill="#16181d" opacity="0.05"/>
<rect x="190" y="204" width="670" height="52" rx="4" fill="none" stroke="#d0d3d8" stroke-width="2"/>
<circle cx="350" cy="230" r="8" fill="#b0761d"/>
<text x="350" y="278" text-anchor="middle" fill="#b0761d" font-size="14">le da el turno</text>

<!-- ================= carril del driver ================= -->
<text x="176" y="352" text-anchor="end" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">driver_h</text>
<text x="176" y="373" text-anchor="end" fill="#5a6068" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace">run_phase()</text>

<rect x="190" y="330" width="350" height="42" rx="3" fill="#16181d" opacity="0.04"/>
<rect x="190" y="330" width="350" height="42" rx="3" fill="none" stroke="#5b6b7a" stroke-width="2" stroke-dasharray="5 4"/>
<text x="365" y="357" text-anchor="middle" fill="#5a6068" font-size="15">bloqueado</text>

<rect x="540" y="330" width="250" height="42" rx="3" fill="#b0761d" opacity="0.14"/>
<rect x="540" y="330" width="250" height="42" rx="3" fill="none" stroke="#b0761d" stroke-width="2"/>
<text x="665" y="349" text-anchor="middle" fill="#b0761d" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace">send_op()</text>
<text x="665" y="366" text-anchor="middle" fill="#b0761d" font-size="14">acá pasa el tiempo</text>

<!-- ================= transferencias ================= -->
<path d="M210,136 V200" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#h-s)"/>
<text x="216" y="162" fill="#16181d" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace">start_item(cmd)</text>

<path d="M350,200 V136" fill="none" stroke="#b0761d" stroke-width="2" marker-end="url(#h-a)"/>

<path d="M500,136 V200" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#h-s)"/>
<text x="506" y="186" fill="#16181d" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace">finish_item(cmd)</text>

<path d="M205,326 V260" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#h-s)"/>
<text x="211" y="298" fill="#16181d" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace">get_next_item(cmd)</text>
<text x="211" y="316" fill="#5a6068" font-size="14">el driver llama y se bloquea</text>

<path d="M540,260 V326" fill="none" stroke="#b0761d" stroke-width="2" marker-end="url(#h-a)"/>
<text x="546" y="282" fill="#b0761d" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace">get_next_item()</text>
<text x="546" y="300" fill="#b0761d" font-size="14">vuelve con cmd</text>

<path d="M790,326 V260" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#h-s)"/>
<text x="782" y="316" text-anchor="end" fill="#16181d" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace">item_done()</text>

<path d="M790,200 V136" fill="none" stroke="#b0761d" stroke-width="2" marker-end="url(#h-a)"/>
<text x="782" y="186" text-anchor="end" fill="#b0761d" font-size="15">vuelve</text>

<!-- ================= pie ================= -->
<path d="M190,424 H852" stroke="#d9dce1" stroke-width="1" marker-end="url(#h-s)"/>
<text x="852" y="446" text-anchor="end" fill="#5a6068" font-size="15">tiempo de simulación</text>

<text x="30" y="480" fill="#5a6068" font-size="17">El tiempo sólo avanza en la barra ámbar del driver: llenar el item no cuesta un flanco.</text>
<text x="30" y="504" fill="#5a6068" font-size="17">Si falta el <tspan fill="#b0761d" font-family="IBM Plex Mono, ui-monospace, monospace">item_done()</tspan>, la sequence queda en <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#16181d">finish_item()</tspan> para siempre.</text>
</svg>
