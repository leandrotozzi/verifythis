<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 492" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Notation: diamond = uvm_analysis_port, circle = analysis_export</title>
<defs>
  <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#b0761d"/>
  </marker>
</defs>

<!-- productor -->
<rect x="40" y="140" width="300" height="110" rx="4" fill="#16181d" opacity="0.06"/>
<rect x="40" y="140" width="300" height="110" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="64" y="186" fill="#16181d" font-size="25" font-family="IBM Plex Mono, ui-monospace, monospace">producer</text>
<text x="64" y="216" fill="#5a6068" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">uvm_component</text>

<!-- subscriber de arriba -->
<rect x="560" y="30" width="300" height="110" rx="4" fill="#16181d" opacity="0.06"/>
<rect x="560" y="30" width="300" height="110" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="588" y="76" fill="#16181d" font-size="25" font-family="IBM Plex Mono, ui-monospace, monospace">subscriber</text>
<text x="588" y="106" fill="#5a6068" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">uvm_subscriber #(T)</text>

<!-- subscriber de abajo -->
<rect x="560" y="250" width="300" height="110" rx="4" fill="#16181d" opacity="0.06"/>
<rect x="560" y="250" width="300" height="110" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="588" y="296" fill="#16181d" font-size="25" font-family="IBM Plex Mono, ui-monospace, monospace">subscriber</text>
<text x="588" y="326" fill="#5a6068" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">uvm_subscriber #(T)</text>

<!-- cableado -->
<path d="M351,195 H472" fill="none" stroke="#b0761d" stroke-width="2"/>
<path d="M472,85 V305" fill="none" stroke="#b0761d" stroke-width="2"/>
<path d="M472,85 H551" fill="none" stroke="#b0761d" stroke-width="2" marker-end="url(#a-acc)"/>
<path d="M472,305 H551" fill="none" stroke="#b0761d" stroke-width="2" marker-end="url(#a-acc)"/>
<circle cx="472" cy="195" r="4" fill="#b0761d"/>

<!-- el rombo del analysis port y los circulos de los exports -->
<path d="M340,184 L351,195 L340,206 L329,195 z" fill="#b0761d"/>
<circle cx="560" cy="85" r="9" fill="#b0761d"/>
<circle cx="560" cy="305" r="9" fill="#b0761d"/>
<text x="322" y="201" fill="#b0761d" font-size="17" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace">ap</text>
<text x="411" y="183" fill="#b0761d" font-size="17" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">write(t)</text>

<!-- la notacion que fija el curso -->
<path d="M50,391 L61,402 L50,413 L39,402 z" fill="#b0761d"/>
<text x="72" y="408" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">uvm_analysis_port</text>
<text x="282" y="408" fill="#5a6068" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">declared by the producer; publishes with .write()</text>

<circle cx="50" cy="434" r="9" fill="#b0761d"/>
<text x="72" y="440" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">analysis_export</text>
<text x="282" y="440" fill="#5a6068" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">comes with uvm_subscriber; tied with .connect()</text>

<text x="40" y="476" fill="#5a6068" font-size="18">In the example: dice_roller publishes the roll; coverage, histogram and average receive it.</text>
</svg>
