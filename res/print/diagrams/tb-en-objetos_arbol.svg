<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 552" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>El árbol de objetos del testbench sin módulos: el top elabora, y adentro viven la clase testbench y sus tres piezas</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
  </marker>
  <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#b0761d"/>
  </marker>
</defs>

<!-- lo que se elabora -->
<rect x="40" y="50" width="820" height="130" rx="6" fill="none" stroke="#d0d3d8" stroke-width="2" stroke-dasharray="7 6"/>
<text x="56" y="42" fill="#5a6068" font-size="17"><tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#16181d">module top</tspan> — lo único que se elabora</text>

<rect x="70" y="86" width="230" height="56" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="185" y="120" text-anchor="middle" fill="#16181d" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace">vtalu DUT</text>

<rect x="330" y="86" width="230" height="56" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="445" y="120" text-anchor="middle" fill="#16181d" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace">vtalu_bfm bfm</text>

<rect x="590" y="86" width="240" height="56" rx="4" fill="#b0761d" fill-opacity="0.12" stroke="#b0761d" stroke-width="2"/>
<text x="710" y="112" text-anchor="middle" fill="#b0761d" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">testbench testbench_h</text>
<text x="710" y="132" text-anchor="middle" fill="#5a6068" font-size="15">un handle, todavía vacío</text>

<!-- del modulo al objeto -->
<path d="M710,142 V270" fill="none" stroke="#b0761d" stroke-width="2" marker-end="url(#a-acc)"/>
<text x="724" y="192" fill="#b0761d" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">new(bfm)</text>
<text x="724" y="216" fill="#b0761d" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">execute()</text>

<!-- los objetos -->
<rect x="40" y="230" width="820" height="240" rx="6" fill="none" stroke="#b0761d" stroke-width="2" stroke-dasharray="7 6" opacity="0.5"/>
<text x="56" y="258" fill="#5a6068" font-size="17">objetos — nadie los elabora, alguien los tiene que crear</text>

<rect x="590" y="270" width="240" height="56" rx="4" fill="#b0761d" fill-opacity="0.12" stroke="#b0761d" stroke-width="2"/>
<text x="710" y="304" text-anchor="middle" fill="#b0761d" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace">testbench</text>

<g fill="none" stroke="#5b6b7a" stroke-width="2">
  <path d="M710,326 V352"/>
  <path d="M180,352 H710"/>
  <path d="M180,352 V382 M445,352 V382 M710,352 V382"/>
</g>

<rect x="70" y="382" width="220" height="52" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="180" y="414" text-anchor="middle" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">tester_h</text>

<rect x="335" y="382" width="220" height="52" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="445" y="414" text-anchor="middle" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">coverage_h</text>

<rect x="600" y="382" width="220" height="52" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="710" y="414" text-anchor="middle" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">scoreboard_h</text>

<text x="180" y="456" text-anchor="middle" fill="#5a6068" font-size="15">un thread</text>
<text x="445" y="456" text-anchor="middle" fill="#5a6068" font-size="15">un thread</text>
<text x="710" y="456" text-anchor="middle" fill="#5a6068" font-size="15">un thread</text>

<text x="40" y="512" fill="#5a6068" font-size="17">Los tres reciben la misma BFM por el constructor, como una <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#16181d">virtual vtalu_bfm</tspan>.</text>
<text x="40" y="538" fill="#5a6068" font-size="17">Desde los tests, este árbol lo arma UVM: <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#16181d">build_phase</tspan>, <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#16181d">config_db</tspan> y un <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#16181d">run_phase</tspan> por pieza.</text>
</svg>
