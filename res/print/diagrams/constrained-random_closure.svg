<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>El ciclo de coverage closure: randomizar, mirar el reporte, llenar el bin que falta y volver a empezar</title>
<defs>
  <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#b0761d"/>
  </marker>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
  </marker>
</defs>

<!-- el ciclo -->
<g fill="none" stroke="#b0761d" stroke-width="2">
  <path d="M320,116 H556" marker-end="url(#a-acc)"/>
  <path d="M690,166 V296" marker-end="url(#a-acc)"/>
  <path d="M560,326 H324" marker-end="url(#a-acc)"/>
  <path d="M190,296 V166" marker-end="url(#a-acc)"/>
</g>

<rect x="60" y="78" width="260" height="76" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="190" y="110" text-anchor="middle" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">randomize()</text>
<text x="190" y="136" text-anchor="middle" fill="#5a6068" font-size="16">el grueso, barato</text>

<rect x="560" y="78" width="260" height="76" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="690" y="110" text-anchor="middle" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">cov_report</text>
<text x="690" y="136" text-anchor="middle" fill="#5a6068" font-size="16">qué quedó afuera</text>

<rect x="560" y="288" width="260" height="76" rx="4" fill="#b0761d" fill-opacity="0.12" stroke="#b0761d" stroke-width="2"/>
<text x="690" y="320" text-anchor="middle" fill="#b0761d" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">randomize() with {}</text>
<text x="690" y="346" text-anchor="middle" fill="#5a6068" font-size="16">el bin que falta, tres líneas</text>

<rect x="60" y="288" width="260" height="76" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="190" y="320" text-anchor="middle" fill="#16181d" font-size="19">otra semilla</text>
<text x="190" y="346" text-anchor="middle" fill="#5a6068" font-size="16">y de nuevo</text>

<!-- el atajo del medio -->
<path d="M565,218 H592 V284" fill="none" stroke="#5b6b7a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>
<rect x="335" y="180" width="230" height="76" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#d0d3d8" stroke-width="2" stroke-dasharray="7 6"/>
<text x="450" y="212" text-anchor="middle" fill="#16181d" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">constraint_mode(0)</text>
<text x="450" y="238" text-anchor="middle" fill="#5a6068" font-size="15">romper una regla a propósito</text>

<text x="40" y="418" fill="#5a6068" font-size="17">Cerrar cobertura es este ciclo, y es a lo que un verificador le dedica el día.</text>
<text x="40" y="444" fill="#5a6068" font-size="17">Lo que <tspan fill="#16181d">no</tspan> es: escribir un test por bin, ni mirar el porcentaje total.</text>
</svg>
