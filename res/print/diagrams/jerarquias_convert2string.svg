<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>convert2string() sobre la jerarquía trago, fernet, fernet_doble, fernet_con_hielo</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
  <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0761d"/></marker>
</defs>

<text x="40" y="34" fill="#5a6068" font-size="19">jerarquía de clases</text>
<path d="M262,28 H512" fill="none" stroke="#b0761d" stroke-width="2" marker-end="url(#a-acc)"/>
<text x="520" y="34" fill="#b0761d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">convert2string()</text>

<!-- el string que devuelve el objeto mas derivado -->
<rect x="520" y="56" width="346" height="296" rx="4" fill="#16181d" opacity="0.06"/>
<rect x="520" y="56" width="346" height="296" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<path d="M534,124 H852" stroke="#d9dce1" stroke-width="1"/>
<path d="M534,204 H852" stroke="#d9dce1" stroke-width="1"/>
<path d="M534,284 H852" stroke="#d9dce1" stroke-width="1"/>
<text x="540" y="91" fill="#16181d" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace">Hielos: 2</text>
<text x="540" y="171" fill="#16181d" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace">Coca: si</text>
<text x="540" y="251" fill="#16181d" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace">Mesa: mesa 4</text>
<text x="540" y="331" fill="#16181d" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace">medidas: 2</text>

<!-- jerarquía: la flecha apunta a la clase padre -->
<rect x="40" y="56" width="300" height="56" rx="4" fill="#16181d" opacity="0.06"/>
<rect x="40" y="56" width="300" height="56" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="56" y="81" fill="#16181d" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">trago</text>
<text x="56" y="102" fill="#5a6068" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">+ hielos : int</text>
<rect x="40" y="136" width="300" height="56" rx="4" fill="#16181d" opacity="0.06"/>
<rect x="40" y="136" width="300" height="56" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="56" y="161" fill="#16181d" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">fernet</text>
<text x="56" y="182" fill="#5a6068" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">+ con_coca : bit</text>
<path d="M190,133 V116" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="216" width="300" height="56" rx="4" fill="#16181d" opacity="0.06"/>
<rect x="40" y="216" width="300" height="56" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="56" y="241" fill="#16181d" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">fernet_doble</text>
<text x="56" y="262" fill="#5a6068" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">+ mesa : string</text>
<path d="M190,213 V196" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="296" width="300" height="56" rx="4" fill="#16181d" opacity="0.06"/>
<rect x="40" y="296" width="300" height="56" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="56" y="321" fill="#16181d" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">fernet_con_hielo</text>
<text x="56" y="342" fill="#5a6068" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">+ medidas : byte</text>
<path d="M190,293 V276" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>

<rect x="520" y="378" width="12" height="12" fill="#1f8b45"/>
<text x="544" y="389" fill="#1f8b45" font-size="18">una línea por clase —</text>
<text x="544" y="411" fill="#1f8b45" font-size="18">mientras nadie toque la jerarquía</text>

<text x="40" y="468" fill="#5a6068" font-size="17">Cada clase agrega un campo y convert2string() los imprime todos, de lo más general a lo más particular.</text>
</svg>
