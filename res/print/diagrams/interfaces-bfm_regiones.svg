<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Las regiones de un flanco: Preponed, Active y NBA, y los tres muestreos que dan valores distintos</title>
<defs>
  <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#b0761d"/>
  </marker>
</defs>

<!-- el reloj -->
<text x="100" y="92" text-anchor="end" fill="#16181d" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace">clk</text>
<path d="M120,100 H250 V60 H700 V100 H860" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<circle cx="250" cy="60" r="7" fill="#b0761d"/>
<circle cx="700" cy="100" r="7" fill="#5b6b7a"/>
<text x="250" y="40" text-anchor="middle" fill="#b0761d" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">posedge</text>
<text x="700" y="40" text-anchor="middle" fill="#5a6068" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">negedge</text>

<!-- el zoom del instante -->
<g stroke="#d0d3d8" stroke-width="2" stroke-dasharray="6 5" fill="none">
  <path d="M250,72 L120,150"/>
  <path d="M250,72 L760,150"/>
</g>
<text x="866" y="140" text-anchor="end" fill="#5a6068" font-size="16">un solo instante,</text>
<text x="866" y="162" text-anchor="end" fill="#5a6068" font-size="16">por dentro</text>

<!-- las regiones -->
<rect x="120" y="150" width="160" height="120" fill="#b0761d" fill-opacity="0.10" stroke="#d0d3d8" stroke-width="2"/>
<rect x="280" y="150" width="160" height="120" fill="#16181d" fill-opacity="0.06" stroke="#d0d3d8" stroke-width="2"/>
<rect x="440" y="150" width="160" height="120" fill="#16181d" fill-opacity="0.06" stroke="#d0d3d8" stroke-width="2"/>
<rect x="600" y="150" width="160" height="120" fill="#16181d" fill-opacity="0.06" stroke="#d0d3d8" stroke-width="2"/>

<text x="200" y="178" text-anchor="middle" fill="#b0761d" font-size="19">Preponed</text>
<text x="360" y="178" text-anchor="middle" fill="#16181d" font-size="19">Active</text>
<text x="520" y="178" text-anchor="middle" fill="#16181d" font-size="19">NBA</text>
<text x="680" y="178" text-anchor="middle" fill="#16181d" font-size="19">Observed</text>

<text x="200" y="206" text-anchor="middle" fill="#5a6068" font-size="15">el valor de antes</text>
<text x="200" y="226" text-anchor="middle" fill="#5a6068" font-size="15">del flanco</text>
<text x="360" y="206" text-anchor="middle" fill="#5a6068" font-size="15">acá despierta</text>
<text x="360" y="226" text-anchor="middle" fill="#5a6068" font-size="15">tu código</text>
<text x="520" y="206" text-anchor="middle" fill="#5a6068" font-size="15">acá aterriza</text>
<text x="520" y="226" text-anchor="middle" fill="#5a6068" font-size="15">el <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#16181d">&lt;=</tspan> del DUT</text>
<text x="680" y="206" text-anchor="middle" fill="#5a6068" font-size="15">se evalúan</text>
<text x="680" y="226" text-anchor="middle" fill="#5a6068" font-size="15">las properties</text>

<text x="200" y="256" text-anchor="middle" fill="#b0761d" font-size="15">acá muestrea SVA</text>

<circle cx="360" cy="290" r="14" fill="none" stroke="#b0761d" stroke-width="2"/>
<text x="360" y="296" text-anchor="middle" fill="#b0761d" font-size="16">1</text>
<circle cx="600" cy="290" r="14" fill="none" stroke="#b0761d" stroke-width="2"/>
<text x="600" y="296" text-anchor="middle" fill="#b0761d" font-size="16">2</text>
<circle cx="700" cy="126" r="14" fill="none" stroke="#b0761d" stroke-width="2"/>
<text x="700" y="132" text-anchor="middle" fill="#b0761d" font-size="16">3</text>

<!-- los tres muestreos -->
<path d="M40,326 H860" stroke="#d9dce1" stroke-width="1"/>
<text x="40" y="352" fill="#5a6068" font-size="16">Tres formas de leer el mismo dato, con el DUT calculando <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#16181d">d_in + 1 = 11</tspan>:</text>

<g font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">
  <circle cx="54" cy="380" r="13" fill="none" stroke="#b0761d" stroke-width="2"/>
  <text x="54" y="386" text-anchor="middle" fill="#b0761d" font-size="15" font-family="IBM Plex Sans, system-ui, sans-serif">1</text>
  <text x="82" y="386" fill="#16181d">@(posedge clk);</text>
  <text x="360" y="386" fill="#5a6068" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="16">leído en Active, antes del NBA</text>
  <text x="800" y="386" text-anchor="end" fill="#b0761d">0</text>

  <circle cx="54" cy="418" r="13" fill="none" stroke="#b0761d" stroke-width="2"/>
  <text x="54" y="424" text-anchor="middle" fill="#b0761d" font-size="15" font-family="IBM Plex Sans, system-ui, sans-serif">2</text>
  <text x="82" y="424" fill="#16181d">@(posedge clk); #1;</text>
  <text x="360" y="424" fill="#5a6068" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="16">el NBA ya aterrizó</text>
  <text x="800" y="424" text-anchor="end" fill="#1f8b45">11</text>

  <circle cx="54" cy="456" r="13" fill="none" stroke="#b0761d" stroke-width="2"/>
  <text x="54" y="462" text-anchor="middle" fill="#b0761d" font-size="15" font-family="IBM Plex Sans, system-ui, sans-serif">3</text>
  <text x="82" y="462" fill="#16181d">@(negedge clk);</text>
  <text x="360" y="462" fill="#5a6068" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="16">el flanco opuesto, medio ciclo después</text>
  <text x="800" y="462" text-anchor="end" fill="#1f8b45">11</text>
</g>

<text x="40" y="500" fill="#5a6068" font-size="17">El <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#16181d">#1</tspan> del medio funciona, y funciona por accidente: no dice qué carrera evita.</text>
</svg>
