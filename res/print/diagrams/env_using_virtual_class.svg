<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 505" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>base_tester abstracta con run_phase() compartido y métodos pure virtual</title>
<rect x="340" y="14" width="220" height="44" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="450" y="43" text-anchor="middle" fill="#16181d" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">uvm_component</text>

<g fill="none" stroke="#5b6b7a" stroke-width="2">
  <path d="M450,58 V92"/>
  <path d="M450,222 V242 M210,242 H690 M210,242 V262 M690,242 V262"/>
</g>

<rect x="270" y="92" width="360" height="130" rx="4" fill="#b0761d" fill-opacity="0.12" stroke="#b0761d" stroke-width="2"/>
<text x="450" y="118" text-anchor="middle" fill="#b0761d" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">virtual base_tester</text>
<path d="M270,128 H630" stroke="#b0761d" stroke-width="2"/>
<text x="286" y="154" fill="#5a6068" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">pure virtual get_op()</text>
<text x="286" y="180" fill="#5a6068" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">pure virtual get_data()</text>
<text x="286" y="206" fill="#b0761d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">run_phase()</text>

<text x="650" y="150" fill="#5a6068" font-size="17">abstracta:</text>
<text x="650" y="172" fill="#5a6068" font-size="17">no se instancia</text>

<rect x="60" y="262" width="300" height="104" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="210" y="288" text-anchor="middle" fill="#16181d" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">random_tester</text>
<path d="M60,298 H360" stroke="#5b6b7a" stroke-width="2"/>
<text x="76" y="324" fill="#5a6068" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">get_op()</text>
<text x="76" y="350" fill="#5a6068" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">get_data()</text>

<rect x="540" y="262" width="300" height="104" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="690" y="288" text-anchor="middle" fill="#16181d" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">add_tester</text>
<path d="M540,298 H840" stroke="#5b6b7a" stroke-width="2"/>
<text x="556" y="324" fill="#5a6068" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">get_op()</text>
<text x="556" y="350" fill="#5a6068" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">get_data()</text>

<path d="M362,344 H538" fill="none" stroke="#5a6068" stroke-width="2" stroke-dasharray="6 5"/>
<text x="450" y="330" text-anchor="middle" fill="#5a6068" font-size="17">todavía duplicado</text>

<text x="40" y="450" fill="#5a6068" font-size="17">Los pure virtual obligan a redefinir get_op() y get_data(), pero ambos siguen sorteando los operandos.</text>
</svg>
