<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Histograma medido de dist: el peso por valor contra el peso por rango</title>

<!-- panel izquierdo: := -->
<text x="235" y="60" text-anchor="middle" fill="#b0761d" font-size="30" font-family="IBM Plex Mono, ui-monospace, monospace">:=</text>
<text x="235" y="88" text-anchor="middle" fill="#5a6068" font-size="17">el peso va a cada valor</text>

<rect x="110" y="387" width="70" height="3" fill="#b0761d"/>
<rect x="200" y="141" width="70" height="249" fill="#5b6b7a"/>
<rect x="290" y="387" width="70" height="3" fill="#b0761d"/>
<text x="145" y="378" text-anchor="middle" fill="#b0761d" font-size="18">0,2 %</text>
<text x="235" y="131" text-anchor="middle" fill="#16181d" font-size="18">99,6 %</text>
<text x="325" y="378" text-anchor="middle" fill="#b0761d" font-size="18">0,2 %</text>

<!-- panel derecho: :/ -->
<text x="655" y="60" text-anchor="middle" fill="#b0761d" font-size="30" font-family="IBM Plex Mono, ui-monospace, monospace">:/</text>
<text x="655" y="88" text-anchor="middle" fill="#5a6068" font-size="17">el peso se reparte</text>

<rect x="530" y="332" width="70" height="58" fill="#b0761d"/>
<rect x="620" y="265" width="70" height="125" fill="#5b6b7a"/>
<rect x="710" y="322" width="70" height="68" fill="#b0761d"/>
<text x="565" y="323" text-anchor="middle" fill="#b0761d" font-size="18">23,2 %</text>
<text x="655" y="256" text-anchor="middle" fill="#16181d" font-size="18">49,8 %</text>
<text x="745" y="313" text-anchor="middle" fill="#b0761d" font-size="18">27,0 %</text>

<!-- ejes -->
<g stroke="#d0d3d8" stroke-width="2">
  <path d="M90,390 H380"/>
  <path d="M510,390 H800"/>
</g>
<g font-size="17" fill="#5a6068" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">
  <text x="145" y="414">00</text>
  <text x="235" y="414">[01:FE]</text>
  <text x="325" y="414">FF</text>
  <text x="565" y="414">00</text>
  <text x="655" y="414">[01:FE]</text>
  <text x="745" y="414">FF</text>
</g>

<text x="40" y="452" fill="#5a6068" font-size="17">400 randomizaciones de cada versión, medidas. Las dos compilan, las dos corren, ninguna avisa.</text>
<text x="40" y="478" fill="#5a6068" font-size="17">Los bins de borde son los mismos, y con <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#16181d">:=</tspan> tardan <tspan fill="#16181d">64 veces</tspan> más en llenarse.</text>
</svg>
