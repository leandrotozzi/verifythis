<polygon points="452,206 783,206 790,222 783,238 452,238" fill="#16181d" opacity="0.07"/>
<path d="M317,206 H428 M317,238 H428 M310,222 L317,206 M310,222 L317,238 M452,206 H783 M452,238 H783 M783,206 L790,222 M783,238 L790,222" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<path d="M220,256 H303 M220,288 H303 M220,256 V288 M303,256 L310,272 M303,288 L310,272" fill="none" stroke="#d0d3d8" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M797,256 H860 M797,288 H860 M790,272 L797,256 M790,272 L797,288 M860,256 V288" fill="none" stroke="#d0d3d8" stroke-width="2" stroke-dasharray="6 5"/>
<polygon points="310,272 317,256 428,256 428,288 317,288" fill="#16181d" opacity="0.07"/>
<polygon points="452,256 783,256 790,272 783,288 452,288" fill="#16181d" opacity="0.07"/>
<path d="M317,256 H428 M317,288 H428 M310,272 L317,256 M310,272 L317,288 M452,256 H783 M452,288 H783 M783,256 L790,272 M783,288 L790,272" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<path d="M220,374 H428 M220,406 H428 M220,374 V406 M452,374 H703 M452,406 H703 M703,374 L710,390 M703,406 L710,390" fill="none" stroke="#d0d3d8" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M797,374 H860 M797,406 H860 M790,390 L797,374 M790,390 L797,406 M860,374 V406" fill="none" stroke="#d0d3d8" stroke-width="2" stroke-dasharray="6 5"/>
<polygon points="710,390 717,374 783,374 790,390 783,406 717,406" fill="#16181d" opacity="0.07"/>
<path d="M717,374 H783 M717,406 H783 M710,390 L717,374 M710,390 L717,406 M783,374 L790,390 M783,406 L790,390" fill="none" stroke="#5b6b7a" stroke-width="2"/>

<!-- tiempo elidido -->
<g stroke="#5a6068" stroke-width="2" fill="none">
  <path d="M430,414 L440,46"/>
  <path d="M440,414 L450,46"/>
</g>
<text x="440" y="434" text-anchor="middle" fill="#5a6068" font-size="17">n cycles</text>

<text x="30" y="470" fill="#5a6068" font-size="18">The testbench waits <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#16181d">done</tspan> to sample <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#16181d">result</tspan>: the latency depends on the operation.</text>
</svg>
