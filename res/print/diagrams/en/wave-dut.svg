<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>VTALU protocol: start and operands stable until done</title>
<defs>
  <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#b0761d"/>
  </marker>
</defs>

<!-- grilla de ciclos -->
<g stroke="#dfe2e6" stroke-width="1" stroke-dasharray="2 5">
  <path d="M220,50 V410"/>
  <path d="M300,50 V410"/>
  <path d="M380,50 V410"/>
  <path d="M460,50 V410"/>
  <path d="M540,50 V410"/>
  <path d="M620,50 V410"/>
  <path d="M700,50 V410"/>
  <path d="M780,50 V410"/>
  <path d="M860,50 V410"/>
</g>

<!-- lo unico en ambar: la ventana estable -->
<rect x="310" y="98" width="400" height="200" fill="#b0761d" opacity="0.10"/>
<g stroke="#b0761d" stroke-width="2" stroke-dasharray="5 5" opacity="0.85">
  <path d="M310,40 V360"/>
  <path d="M710,40 V360"/>
</g>
<path d="M314,40 H706" fill="none" stroke="#b0761d" stroke-width="2" marker-start="url(#a-acc)" marker-end="url(#a-acc)"/>
<text x="510" y="26" text-anchor="middle" fill="#b0761d" font-size="20">start and operands stable until done</text>

<path d="M30,310 H860" stroke="#d9dce1" stroke-width="1"/>

<!-- nombres de senal -->
<text x="200" y="80" text-anchor="end" fill="#16181d" font-size="21" font-family="IBM Plex Mono, ui-monospace, monospace">clk</text>
<text x="200" y="130" text-anchor="end" fill="#16181d" font-size="21" font-family="IBM Plex Mono, ui-monospace, monospace">start</text>
<text x="200" y="180" text-anchor="end" fill="#16181d" font-size="21" font-family="IBM Plex Mono, ui-monospace, monospace">op[2:0]</text>
<text x="200" y="230" text-anchor="end" fill="#16181d" font-size="21" font-family="IBM Plex Mono, ui-monospace, monospace">A[7:0]</text>
<text x="200" y="280" text-anchor="end" fill="#16181d" font-size="21" font-family="IBM Plex Mono, ui-monospace, monospace">B[7:0]</text>
<text x="200" y="348" text-anchor="end" fill="#16181d" font-size="21" font-family="IBM Plex Mono, ui-monospace, monospace">done</text>
<text x="200" y="398" text-anchor="end" fill="#16181d" font-size="21" font-family="IBM Plex Mono, ui-monospace, monospace">result[15:0]</text>

<!-- ondas -->
<g fill="none" stroke="#5b6b7a" stroke-width="2" stroke-linejoin="miter">
  <path d="M220,56 H260 M260,88 H300 M220,88 V56 M260,56 V88 M300,56 H340 M340,88 H380 M300,88 V56 M340,56 V88 M380,56 H420 M420,88 H428 M452,88 H460 M380,88 V56 M420,56 V88 M460,56 H500 M500,88 H540 M460,88 V56 M500,56 V88 M540,56 H580 M580,88 H620 M540,88 V56 M580,56 V88 M620,56 H660 M660,88 H700 M620,88 V56 M660,56 V88 M700,56 H740 M740,88 H780 M700,88 V56 M740,56 V88 M780,56 H820 M820,88 H860 M780,88 V56 M820,56 V88"/>
  <path d="M220,138 H310 M310,106 V138 M310,106 H428 M452,106 H790 M790,106 V138 M790,138 H860"/>
  <path d="M220,356 H428 M452,356 H710 M710,324 V356 M710,324 H790 M790,324 V356 M790,356 H860"/>
</g>

<!-- buses: punteado = indefinido, solido = dato estable -->
<path d="M220,156 H303 M220,188 H303 M220,156 V188 M303,156 L310,172 M303,188 L310,172" fill="none" stroke="#d0d3d8" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M797,156 H860 M797,188 H860 M790,172 L797,156 M790,172 L797,188 M860,156 V188" fill="none" stroke="#d0d3d8" stroke-width="2" stroke-dasharray="6 5"/>
<polygon points="310,172 317,156 428,156 428,188 317,188" fill="#16181d" opacity="0.07"/>
<polygon points="452,156 783,156 790,172 783,188 452,188" fill="#16181d" opacity="0.07"/>
