<text x="675" y="400" fill="#b0761d" font-size="18" text-anchor="middle">1 agent and 2 subscribers</text>
<text x="675" y="426" fill="#5a6068" font-size="17" text-anchor="middle">Second VTALU: one more line, with another config</text>

<text x="450" y="472" fill="#5a6068" font-size="18" text-anchor="middle">The agent is not just another class: it is the unit instantiated once per interface.</text>
