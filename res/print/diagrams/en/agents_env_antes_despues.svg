    <path d="M0,0 L10,5 L0,10 z" fill="#b0761d"/>
  </marker>
</defs>

<text x="235" y="32" fill="#5a6068" font-size="22" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">env · without agent</text>
<text x="675" y="32" fill="#b0761d" font-size="22" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">env · with agent</text>

