<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Anatomy of a property: label, clock, guard, antecedent, implication, consequent and action</title>
<defs>
  <marker id="p-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
  </marker>
</defs>

<text x="30" y="42" fill="#16181d" font-size="24">Anatomy of a property</text>
<text x="30" y="66" fill="#5a6068" font-size="15">the seven parts are always the same; what changes is what goes in each</text>

<rect x="30" y="88" width="840" height="384" rx="6" fill="#16181d" fill-opacity="0.03" stroke="#5b6b7a" stroke-width="2"/>

<!-- 1. label -->
<text x="52" y="132" fill="#b0761d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">a_done_llega :</text>
<path d="M300,126 H470" stroke="#5b6b7a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#p-a)"/>
<text x="484" y="131" fill="#5a6068" font-size="15">the label · shows up in the error message</text>

<!-- 2. reloj -->
<text x="52" y="180" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">assert property (<tspan fill="#b0761d">@(posedge clk)</tspan></text>
<path d="M420,174 H470" stroke="#5b6b7a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#p-a)"/>
<text x="484" y="179" fill="#5a6068" font-size="15">the clock · <tspan fill="#16181d">when it samples</tspan></text>

<!-- 3. disable iff -->
<text x="82" y="228" fill="#b0761d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">disable iff (!reset_n)</text>
<path d="M380,222 H470" stroke="#5b6b7a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#p-a)"/>
<text x="484" y="227" fill="#5a6068" font-size="15">when <tspan fill="#16181d">NOT</tspan> to check</text>

<!-- 4. antecedente -->
<text x="82" y="276" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">start &amp;&amp; (op_set != no_op)</text>
<path d="M400,270 H470" stroke="#5b6b7a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#p-a)"/>
<text x="484" y="275" fill="#5a6068" font-size="15">the antecedent · the <tspan fill="#16181d">«if»</tspan></text>

<!-- 5. implicacion -->
<text x="82" y="324" fill="#1f8b45" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">|-&gt;</text>
<path d="M140,318 H470" stroke="#5b6b7a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#p-a)"/>
<text x="484" y="323" fill="#5a6068" font-size="15">the implication · the same edge</text>
<text x="484" y="343" fill="#6b7078" font-size="14">with <tspan font-family="IBM Plex Mono, ui-monospace, monospace">|=&gt;</tspan> it is the next edge</text>

<!-- 6. consecuente -->
<text x="82" y="382" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">##[1:5] done</text>
<path d="M280,376 H470" stroke="#5b6b7a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#p-a)"/>
<text x="484" y="381" fill="#5a6068" font-size="15">the consequent · the <tspan fill="#16181d">«then»</tspan></text>

<!-- 7. accion -->
<text x="52" y="440" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">) else <tspan fill="#b0761d">`uvm_error("SVA", …)</tspan>;</text>
<path d="M420,434 H470" stroke="#5b6b7a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#p-a)"/>
<text x="484" y="439" fill="#5a6068" font-size="15">the action · so that it <tspan fill="#16181d">counts</tspan> in the Report Summary</text>

<!-- pie: el muestreo -->
<rect x="30" y="492" width="840" height="46" rx="6" fill="#b0761d" fill-opacity="0.10" stroke="#b0761d" stroke-width="2"/>
<text x="50" y="512" fill="#b0761d" font-size="15">An assertion is worth what its sampling is worth</text>
<text x="50" y="530" fill="#5a6068" font-size="14">stimulus → <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#16181d">@(negedge clk)</tspan>, where the BFM writes   ·   DUT response → <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#16181d">@(posedge clk)</tspan>, where the DUT registers</text>
</svg>
