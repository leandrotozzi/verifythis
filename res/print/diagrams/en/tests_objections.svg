<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Timeline of an objection: raise, stimulus, drop, drain_time and the end of the phase, with the transactions still in flight</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
  </marker>
  <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#b0761d"/>
  </marker>
</defs>

<!-- la ventana de drain, atras de todo -->
<rect x="560" y="100" width="140" height="290" fill="#b0761d" opacity="0.08"/>
<g stroke="#b0761d" stroke-width="2" stroke-dasharray="6 5">
  <path d="M700,100 V390"/>
</g>

<!-- los dos instantes que decide the test -->
<g stroke="#b0761d" stroke-width="2">
  <path d="M190,100 V390"/>
  <path d="M560,100 V390"/>
</g>
<text x="190" y="90" text-anchor="middle" fill="#b0761d" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">raise_objection</text>
<text x="560" y="90" text-anchor="middle" fill="#b0761d" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">drop_objection</text>
<text x="760" y="90" text-anchor="middle" fill="#1f8b45" font-size="17">end of the phase</text>

<!-- carril dthe test -->
<text x="170" y="152" text-anchor="end" fill="#16181d" font-size="18">the test</text>
<rect x="190" y="128" width="370" height="34" rx="4" fill="#b0761d" fill-opacity="0.14" stroke="#b0761d" stroke-width="2"/>
<text x="375" y="152" text-anchor="middle" fill="#b0761d" font-size="17">the stimulus: a thousand operations</text>

<!-- carril dthe scoreboard -->
<text x="170" y="252" text-anchor="end" fill="#16181d" font-size="18">the scoreboard</text>
<text x="170" y="276" text-anchor="end" fill="#5a6068" font-size="15">compares one at a time</text>
<g fill="#1f8b45" fill-opacity="0.55">
  <rect x="236" y="236" width="22" height="22" rx="3"/>
  <rect x="306" y="236" width="22" height="22" rx="3"/>
  <rect x="376" y="236" width="22" height="22" rx="3"/>
  <rect x="446" y="236" width="22" height="22" rx="3"/>
  <rect x="516" y="236" width="22" height="22" rx="3"/>
</g>
<g fill="none" stroke="#b0761d" stroke-width="2">
  <rect x="586" y="236" width="22" height="22" rx="3"/>
  <rect x="626" y="236" width="22" height="22" rx="3"/>
  <rect x="666" y="236" width="22" height="22" rx="3"/>
</g>
<text x="637" y="222" text-anchor="middle" fill="#b0761d" font-size="16">in flight</text>
<path d="M637,282 V318" fill="none" stroke="#b0761d" stroke-width="2" marker-start="url(#a-acc)"/>
<text x="637" y="340" text-anchor="middle" fill="#5a6068" font-size="14">the DUT has not answered</text>

<!-- el eje -->
<path d="M60,390 H860" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<text x="630" y="414" text-anchor="middle" fill="#b0761d" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">drain_time</text>
<text x="860" y="414" text-anchor="end" fill="#5a6068" font-size="16">simulation time</text>

<text x="40" y="456" fill="#5a6068" font-size="17">The objection measures the stimulus, not the analysis: when the last one drops, the phase cuts <tspan fill="#16181d">at that instant</tspan>.</text>
<text x="40" y="482" fill="#5a6068" font-size="17">Without the cushion, those three never get compared and the summary says <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#16181d">UVM_ERROR : 0</tspan>.</text>
</svg>
