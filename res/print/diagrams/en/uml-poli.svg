<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>trago, fernet and mojito: which servir() lives in which class</title>
<defs>
  <marker id="tri" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L12,6 L0,12 z" fill="none" stroke="#5b6b7a" stroke-width="1.4"/>
  </marker>
</defs>

<!-- generalizacion -->
<g fill="none" stroke="#5b6b7a" stroke-width="2">
  <path d="M450,210 V172" marker-end="url(#tri)"/>
  <path d="M175,210 H725"/>
  <path d="M175,210 V236 M725,210 V236"/>
</g>

<!-- trago -->
<rect x="320" y="16" width="260" height="156" rx="4" fill="#16181d" fill-opacity="0.06"/>
<rect x="320" y="16" width="260" height="156" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<path d="M320,62 H580 M320,112 H580" stroke="#5b6b7a" stroke-width="2"/>
<text x="450" y="49" text-anchor="middle" fill="#16181d" font-size="26" font-family="IBM Plex Mono, ui-monospace, monospace">trago</text>
<text x="340" y="95" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">hielos : int</text>
<rect x="334" y="122" width="232" height="40" rx="4" fill="#b0761d" fill-opacity="0.12" stroke="#b0761d" stroke-width="2"/>
<text x="450" y="149" text-anchor="middle" fill="#b0761d" font-size="21" font-family="IBM Plex Mono, ui-monospace, monospace">servir()</text>

<!-- fernet -->
<rect x="45" y="236" width="260" height="124" rx="4" fill="#16181d" fill-opacity="0.06"/>
<rect x="45" y="236" width="260" height="124" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<path d="M45,282 H305" stroke="#5b6b7a" stroke-width="2"/>
<text x="175" y="269" text-anchor="middle" fill="#16181d" font-size="26" font-family="IBM Plex Mono, ui-monospace, monospace">fernet</text>
<text x="175" y="321" text-anchor="middle" fill="#16181d" font-size="21" font-family="IBM Plex Mono, ui-monospace, monospace">servir()</text>
<text x="175" y="344" text-anchor="middle" fill="#5a6068" font-size="16">"Fernet: 70/30"</text>

<!-- mojito -->
<rect x="595" y="236" width="260" height="124" rx="4" fill="#16181d" fill-opacity="0.06"/>
<rect x="595" y="236" width="260" height="124" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<path d="M595,282 H855" stroke="#5b6b7a" stroke-width="2"/>
<text x="725" y="269" text-anchor="middle" fill="#16181d" font-size="26" font-family="IBM Plex Mono, ui-monospace, monospace">mojito</text>
<text x="725" y="321" text-anchor="middle" fill="#16181d" font-size="21" font-family="IBM Plex Mono, ui-monospace, monospace">servir()</text>
<text x="725" y="344" text-anchor="middle" fill="#5a6068" font-size="16">"Mojito: mint &amp; lime"</text>

<!-- la moraleja -->
<text x="45" y="398" fill="#5a6068" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">trago_h = fernet_h;   trago_h.servir();</text>
<text x="45" y="426" fill="#5a6068" font-size="18">Without virtual the variable type wins (trago, $fatal). With virtual the object wins (fernet).</text>
</svg>
