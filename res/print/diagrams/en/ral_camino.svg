<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>The RAL data path: from the model write down to the bus, and from the monitor up to the mirror through the predictor</title>
<defs>
  <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#b0761d"/>
  </marker>
  <marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f8b45"/>
  </marker>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
  </marker>
</defs>

<!-- el atajo de la prediccion automatica -->
<text x="450" y="28" text-anchor="middle" fill="#5a6068" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace">set_auto_predict(1)</text>
<text x="450" y="50" text-anchor="middle" fill="#5a6068" font-size="15">the mirror changes without looking at the wire</text>
<path d="M322,86 H578" fill="none" stroke="#5b6b7a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>

<!-- arriba: la llamada y el espejo -->
<rect x="60" y="60" width="260" height="52" rx="4" fill="#b0761d" fill-opacity="0.12" stroke="#b0761d" stroke-width="2"/>
<text x="190" y="93" text-anchor="middle" fill="#b0761d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">model.CTRL.write()</text>

<rect x="580" y="60" width="260" height="52" rx="4" fill="#1f8b45" fill-opacity="0.12" stroke="#1f8b45" stroke-width="2"/>
<text x="710" y="85" text-anchor="middle" fill="#1f8b45" font-size="19">the mirror</text>
<text x="710" y="105" text-anchor="middle" fill="#5a6068" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace">get_mirrored_value()</text>

<!-- la bajada -->
<g fill="none" stroke="#b0761d" stroke-width="2">
  <path d="M190,112 V140" marker-end="url(#a-acc)"/>
  <path d="M190,188 V210" marker-end="url(#a-acc)"/>
  <path d="M190,258 V280" marker-end="url(#a-acc)"/>
  <path d="M190,328 V350" marker-end="url(#a-acc)"/>
  <path d="M190,398 V460 H326" marker-end="url(#a-acc)"/>
</g>
<g fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2">
  <rect x="60" y="140" width="260" height="48" rx="4"/>
  <rect x="60" y="210" width="260" height="48" rx="4"/>
  <rect x="60" y="280" width="260" height="48" rx="4"/>
  <rect x="60" y="350" width="260" height="48" rx="4"/>
</g>
<text x="190" y="171" text-anchor="middle" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">default_map</text>
<text x="190" y="241" text-anchor="middle" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">adapter.reg2bus()</text>
<text x="190" y="311" text-anchor="middle" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">sequencer_h</text>
<text x="190" y="381" text-anchor="middle" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">driver_h</text>

<text x="340" y="170" fill="#5a6068" font-size="15">the address comes from here</text>
<text x="340" y="240" fill="#5a6068" font-size="15">the only one that knows about APB</text>
<text x="340" y="310" fill="#5a6068" font-size="15">the agent one, the usual</text>

<!-- el DUT -->
<rect x="330" y="430" width="240" height="60" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="450" y="455" text-anchor="middle" fill="#16181d" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace">DUT</text>
<text x="450" y="478" text-anchor="middle" fill="#5a6068" font-size="15">the wire, which is the only truth</text>

<!-- la subida -->
<g fill="none" stroke="#1f8b45" stroke-width="2">
  <path d="M574,460 H710 V398" marker-end="url(#a-ok)"/>
  <path d="M710,350 V328" marker-end="url(#a-ok)"/>
  <path d="M710,280 V258" marker-end="url(#a-ok)"/>
  <path d="M710,210 V188" marker-end="url(#a-ok)"/>
  <path d="M710,140 V112" marker-end="url(#a-ok)"/>
</g>
<g fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2">
  <rect x="580" y="350" width="260" height="48" rx="4"/>
  <rect x="580" y="280" width="260" height="48" rx="4"/>
  <rect x="580" y="210" width="260" height="48" rx="4"/>
  <rect x="580" y="140" width="260" height="48" rx="4"/>
</g>
<text x="710" y="381" text-anchor="middle" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">monitor_h</text>
<text x="710" y="311" text-anchor="middle" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">agent_h.ap</text>
<text x="710" y="241" text-anchor="middle" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">predictor</text>
<text x="710" y="171" text-anchor="middle" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">adapter.bus2reg()</text>

<text x="642" y="442" text-anchor="middle" fill="#1f8b45" font-size="15">what the wire saw</text>

<text x="40" y="530" fill="#5a6068" font-size="17">A single piece knows there is an APB below, and it is written twice: <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#16181d">reg2bus</tspan> goes down, <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#16181d">bus2reg</tspan> goes up.</text>
<text x="40" y="556" fill="#5a6068" font-size="17">With explicit prediction the mirror believes <tspan fill="#16181d">what happened on the wire</tspan>, not what the model meant to send.</text>
</svg>
