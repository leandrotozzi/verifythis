<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>The class diagram before and after splitting structure from stimulus with uvm_env</title>
<!-- antes: el test instancia todo -->
<rect x="40" y="96" width="370" height="304" rx="6" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="58" y="122" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">random_test extends uvm_test</text>
<rect x="70" y="140" width="310" height="70" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="225" y="170" text-anchor="middle" fill="#16181d" font-size="21" font-family="IBM Plex Mono, ui-monospace, monospace">tester_h</text>
<text x="225" y="194" text-anchor="middle" fill="#5a6068" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace">random_tester</text>
<rect x="70" y="224" width="310" height="70" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="225" y="254" text-anchor="middle" fill="#16181d" font-size="21" font-family="IBM Plex Mono, ui-monospace, monospace">coverage_h</text>
<text x="225" y="278" text-anchor="middle" fill="#5a6068" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace">coverage</text>
<rect x="70" y="308" width="310" height="70" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="225" y="338" text-anchor="middle" fill="#16181d" font-size="21" font-family="IBM Plex Mono, ui-monospace, monospace">scoreboard_h</text>
<text x="225" y="362" text-anchor="middle" fill="#5a6068" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace">scoreboard</text>
<text x="225" y="440" text-anchor="middle" fill="#5a6068" font-size="18">before: the test builds the structure</text>
<text x="225" y="464" text-anchor="middle" fill="#5a6068" font-size="18">and picks the stimulus</text>

<!-- despues: env se queda con la estructura -->
<rect x="470" y="56" width="390" height="366" rx="6" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="488" y="82" fill="#16181d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">random_test extends uvm_test</text>
<rect x="490" y="100" width="350" height="300" rx="6" fill="#b0761d" fill-opacity="0.07" stroke="#b0761d" stroke-width="2"/>
<text x="508" y="126" fill="#b0761d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">env extends uvm_env</text>
<rect x="510" y="140" width="310" height="70" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="665" y="170" text-anchor="middle" fill="#16181d" font-size="21" font-family="IBM Plex Mono, ui-monospace, monospace">tester_h</text>
<text x="665" y="194" text-anchor="middle" fill="#5a6068" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace">base_tester</text>
<rect x="510" y="224" width="310" height="70" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="665" y="254" text-anchor="middle" fill="#16181d" font-size="21" font-family="IBM Plex Mono, ui-monospace, monospace">coverage_h</text>
<text x="665" y="278" text-anchor="middle" fill="#5a6068" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace">coverage</text>
<rect x="510" y="308" width="310" height="70" rx="4" fill="#16181d" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="665" y="338" text-anchor="middle" fill="#16181d" font-size="21" font-family="IBM Plex Mono, ui-monospace, monospace">scoreboard_h</text>
<text x="665" y="362" text-anchor="middle" fill="#5a6068" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace">scoreboard</text>
<text x="665" y="440" text-anchor="middle" fill="#5a6068" font-size="18">after: env builds the structure,</text>
<text x="665" y="464" text-anchor="middle" fill="#5a6068" font-size="18">the test only picks the stimulus</text>
</svg>
