<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Observer: one sender publishes and N observers receive</title>
<defs>
  <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#e7ad52"/>
  </marker>
</defs>

<!-- emisor -->
<rect x="40" y="80" width="250" height="150" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="40" y="80" width="250" height="150" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="165" y="118" fill="#f0f0f0" font-size="24" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">dice_roller_h</text>
<text x="165" y="142" fill="#8d8d8d" font-size="17" text-anchor="middle">observed object</text>
<rect x="68" y="152" width="194" height="58" rx="4" fill="none" stroke="#e7ad52" stroke-width="2"/>
<text x="165" y="178" fill="#e7ad52" font-size="22" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">roll_ap</text>
<text x="165" y="200" fill="#8d8d8d" font-size="16" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">uvm_analysis_port</text>

<!-- publicacion: tronco + bus + ramas, todas en un solo sentido -->
<text x="400" y="62" fill="#e7ad52" font-size="18" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">roll_ap.write(t)</text>
<line x1="290" y1="181" x2="400" y2="181" stroke="#e7ad52" stroke-width="2"/>
<line x1="400" y1="79" x2="400" y2="283" stroke="#e7ad52" stroke-width="2"/>
<circle cx="400" cy="181" r="5" fill="#e7ad52"/>
<line x1="400" y1="79" x2="550" y2="79" stroke="#e7ad52" stroke-width="2" marker-end="url(#a-acc)"/>
<line x1="400" y1="181" x2="550" y2="181" stroke="#e7ad52" stroke-width="2" marker-end="url(#a-acc)"/>
<line x1="400" y1="283" x2="550" y2="283" stroke="#e7ad52" stroke-width="2" marker-end="url(#a-acc)"/>
<line x1="400" y1="283" x2="400" y2="385" stroke="#e7ad52" stroke-width="2" stroke-dasharray="6 7" opacity="0.55"/>
<line x1="400" y1="385" x2="550" y2="385" stroke="#e7ad52" stroke-width="2" stroke-dasharray="6 7" opacity="0.55" marker-end="url(#a-acc)"/>

<!-- observadores -->
<rect x="556" y="40" width="304" height="78" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="556" y="40" width="304" height="78" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="580" y="76" fill="#f0f0f0" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">average_h</text>
<text x="580" y="100" fill="#8d8d8d" font-size="17">takes the average</text>

<rect x="556" y="142" width="304" height="78" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="556" y="142" width="304" height="78" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="580" y="178" fill="#f0f0f0" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">histogram_h</text>
<text x="580" y="202" fill="#8d8d8d" font-size="17">builds the histogram of sums</text>

<rect x="556" y="244" width="304" height="78" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="556" y="244" width="304" height="78" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="580" y="280" fill="#f0f0f0" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">coverage_h</text>
<text x="580" y="304" fill="#8d8d8d" font-size="17">measures the coverage from 2 to 12</text>

<rect x="556" y="346" width="304" height="78" rx="4" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="6 7"/>
<text x="580" y="382" fill="#8d8d8d" font-size="22">one more observer</text>
<text x="580" y="406" fill="#8d8d8d" font-size="17">the sender never finds out</text>

<text x="40" y="452" fill="#8d8d8d" font-size="19">The arrows go one way only: the sender does not know who or how many listen.</text>
</svg>
