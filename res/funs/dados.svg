<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Rolling 2d6: the sum goes from 2 to 12 and 7 is the most likely</title>

<!-- piso comun: los dados y las barras apoyan en la misma linea -->
<line x1="45" y1="290" x2="866" y2="290" stroke="#444" stroke-width="2"/>

<!-- dado 1: sale 3 -->
<rect x="55" y="160" width="130" height="130" rx="14" fill="#ffffff" opacity="0.06"/>
<rect x="55" y="160" width="130" height="130" rx="14" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<circle cx="87.5" cy="192.5" r="11" fill="#f0f0f0"/>
<circle cx="120" cy="225" r="11" fill="#f0f0f0"/>
<circle cx="152.5" cy="257.5" r="11" fill="#f0f0f0"/>

<text x="200" y="238" fill="#8d8d8d" font-size="32" text-anchor="middle">+</text>

<!-- dado 2: sale 4 -->
<rect x="215" y="160" width="130" height="130" rx="14" fill="#ffffff" opacity="0.06"/>
<rect x="215" y="160" width="130" height="130" rx="14" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<circle cx="247.5" cy="192.5" r="11" fill="#f0f0f0"/>
<circle cx="312.5" cy="192.5" r="11" fill="#f0f0f0"/>
<circle cx="247.5" cy="257.5" r="11" fill="#f0f0f0"/>
<circle cx="312.5" cy="257.5" r="11" fill="#f0f0f0"/>

<text x="365" y="239" fill="#e7ad52" font-size="36" font-weight="600">= 7</text>

<!-- histograma de la suma: 2 a 12, forma triangular (1..6..1 de 36 combinaciones) -->
<rect x="470" y="254" width="26" height="36" fill="#5b6b7a"/>
<rect x="506" y="218" width="26" height="72" fill="#5b6b7a"/>
<rect x="542" y="182" width="26" height="108" fill="#5b6b7a"/>
<rect x="578" y="146" width="26" height="144" fill="#5b6b7a"/>
<rect x="614" y="110" width="26" height="180" fill="#5b6b7a"/>
<rect x="650" y="74" width="26" height="216" fill="#e7ad52"/>
<rect x="686" y="110" width="26" height="180" fill="#5b6b7a"/>
<rect x="722" y="146" width="26" height="144" fill="#5b6b7a"/>
<rect x="758" y="182" width="26" height="108" fill="#5b6b7a"/>
<rect x="794" y="218" width="26" height="72" fill="#5b6b7a"/>
<rect x="830" y="254" width="26" height="36" fill="#5b6b7a"/>

<text x="483" y="316" fill="#8d8d8d" font-size="17" text-anchor="middle">2</text>
<text x="519" y="316" fill="#8d8d8d" font-size="17" text-anchor="middle">3</text>
<text x="555" y="316" fill="#8d8d8d" font-size="17" text-anchor="middle">4</text>
<text x="591" y="316" fill="#8d8d8d" font-size="17" text-anchor="middle">5</text>
<text x="627" y="316" fill="#8d8d8d" font-size="17" text-anchor="middle">6</text>
<text x="663" y="316" fill="#e7ad52" font-size="17" font-weight="600" text-anchor="middle">7</text>
<text x="699" y="316" fill="#8d8d8d" font-size="17" text-anchor="middle">8</text>
<text x="735" y="316" fill="#8d8d8d" font-size="17" text-anchor="middle">9</text>
<text x="771" y="316" fill="#8d8d8d" font-size="17" text-anchor="middle">10</text>
<text x="807" y="316" fill="#8d8d8d" font-size="17" text-anchor="middle">11</text>
<text x="843" y="316" fill="#8d8d8d" font-size="17" text-anchor="middle">12</text>

<text x="55" y="356" fill="#8d8d8d" font-size="20">20 rolls of 2d6: average, histogram and coverage from 2 to 12.</text>
<text x="55" y="382" fill="#8d8d8d" font-size="17">The sum is never 1 or 13, and 7 comes up in 6 of the 36 combinations.</text>
</svg>
