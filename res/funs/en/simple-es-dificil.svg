<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>The same move: tangled and simple</title>
<defs>
  <marker id="pf-gris" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8d8d8d"/>
  </marker>
  <marker id="pf-acc" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#e7ad52"/>
  </marker>
</defs>

<!-- ============ izquierda: intractable ============ -->
<rect x="30" y="52" width="400" height="316" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="30" y="52" width="400" height="316" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="230" y="88" fill="#8d8d8d" font-size="20" text-anchor="middle"
      font-family="IBM Plex Mono, ui-monospace, monospace">intractable</text>
<text x="230" y="112" fill="#8d8d8d" font-size="16" text-anchor="middle">everything wired to everything</text>

<!-- pases cruzados, sin orden -->
<g stroke="#8d8d8d" stroke-width="2" fill="none" opacity="0.8">
  <path d="M100,180 L215,150" marker-end="url(#pf-gris)"/>
  <path d="M215,150 L130,265" marker-end="url(#pf-gris)"/>
  <path d="M130,265 L280,185" marker-end="url(#pf-gris)"/>
  <path d="M280,185 L165,320" marker-end="url(#pf-gris)"/>
  <path d="M165,320 L245,255" marker-end="url(#pf-gris)"/>
  <path d="M245,255 L110,215" marker-end="url(#pf-gris)"/>
  <path d="M110,215 L285,300" marker-end="url(#pf-gris)"/>
</g>
<!-- el centro que se va afuera -->
<path d="M285,300 L400,120" stroke="#8d8d8d" stroke-width="2" fill="none"
      stroke-dasharray="6 5" marker-end="url(#pf-gris)"/>

<g fill="#5b6b7a">
  <circle cx="100" cy="180" r="7"/><circle cx="215" cy="150" r="7"/>
  <circle cx="130" cy="265" r="7"/><circle cx="280" cy="185" r="7"/>
  <circle cx="165" cy="320" r="7"/><circle cx="245" cy="255" r="7"/>
  <circle cx="110" cy="215" r="7"/><circle cx="285" cy="300" r="7"/>
</g>

<!-- arco izquierdo: el pase pasa por arriba -->
<path d="M360,200 L400,200 L400,300 L360,300" fill="none" stroke="#5b6b7a" stroke-width="3"/>
<text x="380" y="330" fill="#8d8d8d" font-size="15" text-anchor="middle">outside</text>

<!-- ============ derecha: adaptable ============ -->
<rect x="470" y="52" width="400" height="316" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="470" y="52" width="400" height="316" rx="4" fill="none" stroke="#e7ad52" stroke-width="2"/>
<text x="670" y="88" fill="#e7ad52" font-size="20" text-anchor="middle"
      font-family="IBM Plex Mono, ui-monospace, monospace">adaptable</text>
<text x="670" y="112" fill="#8d8d8d" font-size="16" text-anchor="middle">each piece does one thing</text>

<!-- tres toques -->
<g stroke="#e7ad52" stroke-width="3" fill="none">
  <path d="M540,300 L630,255" marker-end="url(#pf-acc)"/>
  <path d="M630,255 L720,215" marker-end="url(#pf-acc)"/>
  <path d="M720,215 L800,250" marker-end="url(#pf-acc)"/>
</g>
<g fill="#e7ad52">
  <circle cx="540" cy="300" r="8"/><circle cx="630" cy="255" r="8"/>
  <circle cx="720" cy="215" r="8"/>
</g>

<!-- arco derecho: entra -->
<path d="M800,200 L840,200 L840,300 L800,300" fill="none" stroke="#e7ad52" stroke-width="3"/>
<text x="820" y="330" fill="#e7ad52" font-size="15" text-anchor="middle">goal</text>

<text x="670" y="356" fill="#8d8d8d" font-size="15" text-anchor="middle">three passes, and none of them decorative</text>
</svg>
