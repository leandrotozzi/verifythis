<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>El tester y el driver del VTALU separados por una uvm_tlm_fifo</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
  </marker>
</defs>

<!-- genera el estimulo -->
<rect x="30" y="100" width="216" height="76" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="30" y="100" width="216" height="76" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="138" y="132" fill="#f0f0f0" font-size="21" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">random_tester_h</text>
<text x="138" y="158" fill="#8d8d8d" font-size="16" text-anchor="middle">elige el estímulo</text>
<rect x="235" y="127" width="22" height="22" fill="#5b6b7a"/>
<text x="246" y="92" fill="#8d8d8d" font-size="16" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">command_port</text>
<text x="246" y="70" fill="#8d8d8d" font-size="16" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">uvm_put_port</text>

<!-- la fifo -->
<rect x="340" y="94" width="270" height="88" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="340" y="94" width="270" height="88" rx="4" fill="none" stroke="#e7ad52" stroke-width="2"/>
<text x="475" y="126" fill="#e7ad52" font-size="22" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">command_f</text>
<text x="475" y="150" fill="#8d8d8d" font-size="16" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">uvm_tlm_fifo #(command_s)</text>
<text x="475" y="172" fill="#8d8d8d" font-size="16" text-anchor="middle">capacidad: 1 comando</text>
<circle cx="340" cy="138" r="9" fill="#e7ad52"/>
<circle cx="610" cy="138" r="9" fill="#e7ad52"/>
<text x="340" y="206" fill="#8d8d8d" font-size="16" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">put_export</text>
<text x="610" y="206" fill="#8d8d8d" font-size="16" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">get_export</text>

<!-- aplica el estimulo -->
<rect x="686" y="100" width="184" height="76" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="686" y="100" width="184" height="76" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="778" y="132" fill="#f0f0f0" font-size="21" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">driver_h</text>
<text x="778" y="158" fill="#8d8d8d" font-size="16" text-anchor="middle">lo aplica a la BFM</text>
<rect x="675" y="127" width="22" height="22" fill="#5b6b7a"/>
<text x="686" y="92" fill="#8d8d8d" font-size="16" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">command_port</text>
<text x="686" y="70" fill="#8d8d8d" font-size="16" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">uvm_get_port</text>

<!-- transferencias -->
<path d="M261,138 L329,138" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<text x="295" y="116" fill="#8d8d8d" font-size="18" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">put()</text>
<path d="M671,138 L621,138" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<text x="646" y="116" fill="#8d8d8d" font-size="18" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">get()</text>
<text x="295" y="232" fill="#e7ad52" font-size="17" text-anchor="middle">FIFO llena → bloquea al tester</text>
<text x="646" y="232" fill="#e7ad52" font-size="17" text-anchor="middle">FIFO vacía → bloquea al driver</text>

<!-- BFM y capa de analisis -->
<path d="M778,176 L778,246" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="250" width="840" height="48" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="30" y="250" width="840" height="48" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="450" y="280" fill="#f0f0f0" font-size="24" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">vtalu_bfm</text>
<path d="M250,298 L250,332" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<text x="262" y="322" fill="#8d8d8d" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace">write_to_monitor()</text>
<rect x="30" y="336" width="700" height="68" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="30" y="336" width="700" height="68" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="380" y="366" fill="#f0f0f0" font-size="17" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">command_monitor_h · result_monitor_h · coverage_h · scoreboard_h</text>
<text x="380" y="390" fill="#8d8d8d" font-size="16" text-anchor="middle">la capa de análisis, sin cambios</text>
</svg>
