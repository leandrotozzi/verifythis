<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 505" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Dos testers que extienden uvm_component y duplican run_phase()</title>
<rect x="340" y="14" width="220" height="44" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="450" y="43" text-anchor="middle" fill="#f0f0f0" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">uvm_component</text>

<g fill="none" stroke="#5b6b7a" stroke-width="2">
  <path d="M450,58 V88 M210,88 H690 M210,88 V262 M690,88 V262"/>
</g>
<text x="450" y="112" text-anchor="middle" fill="#8d8d8d" font-size="17">cada uno extiende por su cuenta</text>

<rect x="60" y="262" width="300" height="130" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="210" y="288" text-anchor="middle" fill="#f0f0f0" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">random_tester</text>
<path d="M60,298 H360" stroke="#5b6b7a" stroke-width="2"/>
<text x="76" y="324" fill="#8d8d8d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">get_op()</text>
<text x="76" y="350" fill="#8d8d8d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">get_data()</text>
<text x="76" y="376" fill="#e7ad52" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">run_phase()</text>

<rect x="540" y="262" width="300" height="130" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="690" y="288" text-anchor="middle" fill="#f0f0f0" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">add_tester</text>
<path d="M540,298 H840" stroke="#5b6b7a" stroke-width="2"/>
<text x="556" y="324" fill="#8d8d8d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">get_op()</text>
<text x="556" y="350" fill="#8d8d8d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">get_data()</text>
<text x="556" y="376" fill="#e7ad52" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">run_phase()</text>

<path d="M362,370 H538" fill="none" stroke="#e7ad52" stroke-width="2" stroke-dasharray="6 5"/>
<text x="450" y="356" text-anchor="middle" fill="#e7ad52" font-size="17">duplicado</text>

<text x="40" y="450" fill="#8d8d8d" font-size="17">El mismo run_phase() escrito dos veces: dos lugares para tocar cuando cambia el bucle de estímulo.</text>
</svg>
