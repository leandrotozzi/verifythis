<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 494" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Un agent activo y uno pasivo: que se construye en cada modo</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
  </marker>
</defs>

<text x="232" y="34" fill="#e7ad52" font-size="26" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">UVM_ACTIVE</text>
<text x="668" y="34" fill="#f0f0f0" font-size="26" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">UVM_PASSIVE</text>

<!-- agent activo -->
<rect x="24" y="54" width="416" height="302" rx="6" fill="none" stroke="#e7ad52" stroke-width="2"/>
<text x="44" y="344" fill="#e7ad52" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">clase_agent_h</text>

<rect x="52" y="84" width="360" height="56" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="52" y="84" width="360" height="56" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="232" y="119" fill="#f0f0f0" font-size="20" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">sequencer_h</text>

<rect x="52" y="150" width="360" height="56" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="52" y="150" width="360" height="56" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="232" y="185" fill="#f0f0f0" font-size="20" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">driver_h</text>

<rect x="52" y="224" width="360" height="52" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="52" y="224" width="360" height="52" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="232" y="257" fill="#f0f0f0" font-size="20" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">command_monitor_h</text>

<rect x="52" y="284" width="360" height="52" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="52" y="284" width="360" height="52" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="232" y="317" fill="#f0f0f0" font-size="20" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">result_monitor_h</text>

<!-- agent pasivo -->
<rect x="460" y="54" width="416" height="302" rx="6" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="480" y="344" fill="#8d8d8d" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">modulo_agent_h</text>

<rect x="488" y="84" width="360" height="56" rx="4" fill="none" stroke="#3f3f3f" stroke-width="2" stroke-dasharray="7 6"/>
<text x="668" y="112" fill="#5f5f5f" font-size="20" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">sequencer_h</text>
<text x="668" y="132" fill="#5f5f5f" font-size="15" text-anchor="middle">no se construye · queda en null</text>

<rect x="488" y="150" width="360" height="56" rx="4" fill="none" stroke="#3f3f3f" stroke-width="2" stroke-dasharray="7 6"/>
<text x="668" y="178" fill="#5f5f5f" font-size="20" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">driver_h</text>
<text x="668" y="198" fill="#5f5f5f" font-size="15" text-anchor="middle">no se construye · queda en null</text>

<rect x="488" y="224" width="360" height="52" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="488" y="224" width="360" height="52" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="668" y="257" fill="#f0f0f0" font-size="20" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">command_monitor_h</text>

<rect x="488" y="284" width="360" height="52" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="488" y="284" width="360" height="52" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="668" y="317" fill="#f0f0f0" font-size="20" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">result_monitor_h</text>

<!-- quien maneja cada interface -->
<path d="M232,356 V386" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<path d="M668,420 V390" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>

<rect x="24" y="390" width="416" height="54" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="24" y="390" width="416" height="54" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="232" y="414" fill="#f0f0f0" font-size="19" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">clase_bfm</text>
<text x="232" y="435" fill="#8d8d8d" font-size="15" text-anchor="middle">la maneja el driver del agent</text>

<rect x="460" y="390" width="416" height="54" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="460" y="390" width="416" height="54" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="668" y="414" fill="#f0f0f0" font-size="19" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">modulo_bfm</text>
<text x="668" y="435" fill="#8d8d8d" font-size="15" text-anchor="middle">la maneja vtalu_tester_module — el agent sólo mira</text>

<text x="450" y="478" fill="#e7ad52" font-size="17" text-anchor="middle">Los monitores y los dos analysis ports se construyen SIEMPRE: un agent pasivo sigue alimentando scoreboard y cobertura.</text>
</svg>
