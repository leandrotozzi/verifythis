<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>cantina builds fernet and mojito, and returns a trago handle</title>
<defs>
  <marker id="tri" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L12,6 L0,12 z" fill="none" stroke="#5b6b7a" stroke-width="1.4"/>
  </marker>
  <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#e7ad52"/>
  </marker>
</defs>

<!-- generalizacion -->
<g fill="none" stroke="#5b6b7a" stroke-width="2">
  <path d="M505,292 V250" marker-end="url(#tri)"/>
  <path d="M185,292 H725"/>
  <path d="M185,292 V318 M725,292 V318"/>
</g>

<!-- cantina: el acento de la figura -->
<rect x="20" y="60" width="260" height="140" rx="4" fill="#e7ad52" fill-opacity="0.12" stroke="#e7ad52" stroke-width="2"/>
<path d="M20,110 H280" stroke="#e7ad52" stroke-width="2"/>
<text x="150" y="95" text-anchor="middle" fill="#e7ad52" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">cantina</text>
<text x="38" y="138" fill="#8d8d8d" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace">static function</text>
<text x="38" y="162" fill="#f0f0f0" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">make_trago(species,</text>
<text x="38" y="186" fill="#f0f0f0" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">age, name) : trago</text>
<path d="M280,130 H338" fill="none" stroke="#e7ad52" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-acc)"/>

<!-- trago -->
<rect x="340" y="14" width="330" height="236" rx="4" fill="#ffffff" fill-opacity="0.06"/>
<rect x="340" y="14" width="330" height="236" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<path d="M340,76 H670 M340,140 H670" stroke="#5b6b7a" stroke-width="2"/>
<text x="505" y="47" text-anchor="middle" fill="#f0f0f0" font-size="26" font-family="IBM Plex Mono, ui-monospace, monospace">trago</text>
<text x="505" y="68" text-anchor="middle" fill="#8d8d8d" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace">virtual class</text>
<text x="360" y="106" fill="#f0f0f0" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">hielos : int</text>
<text x="360" y="130" fill="#f0f0f0" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">name : string</text>
<text x="360" y="166" fill="#f0f0f0" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">new(a, n)</text>
<text x="360" y="190" fill="#f0f0f0" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">get_age() : int</text>
<text x="360" y="214" fill="#f0f0f0" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">get_name() : string</text>
<text x="360" y="238" fill="#f0f0f0" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">pure virtual servir()</text>

<!-- fernet -->
<rect x="45" y="318" width="280" height="138" rx="4" fill="#ffffff" fill-opacity="0.06"/>
<rect x="45" y="318" width="280" height="138" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<path d="M45,362 H325 M45,394 H325" stroke="#5b6b7a" stroke-width="2"/>
<text x="185" y="350" text-anchor="middle" fill="#f0f0f0" font-size="24" font-family="IBM Plex Mono, ui-monospace, monospace">fernet</text>
<text x="65" y="386" fill="#f0f0f0" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">thorn_in_paw : bit</text>
<text x="65" y="418" fill="#f0f0f0" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">new(a, n)</text>
<text x="65" y="442" fill="#f0f0f0" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">servir()</text>

<!-- mojito -->
<rect x="585" y="318" width="280" height="138" rx="4" fill="#ffffff" fill-opacity="0.06"/>
<rect x="585" y="318" width="280" height="138" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<path d="M585,362 H865 M585,394 H865" stroke="#5b6b7a" stroke-width="2"/>
<text x="725" y="350" text-anchor="middle" fill="#f0f0f0" font-size="24" font-family="IBM Plex Mono, ui-monospace, monospace">mojito</text>
<text x="605" y="386" fill="#8d8d8d" font-size="16">adds nothing of its own</text>
<text x="605" y="418" fill="#f0f0f0" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">new(a, n)</text>
<text x="605" y="442" fill="#f0f0f0" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">servir()</text>

<!-- por que hace falta $cast -->
<text x="45" y="484" fill="#8d8d8d" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">$cast(fernet_h, trago_h)</text>
<text x="300" y="484" fill="#8d8d8d" font-size="18">&#8212; the handle comes out as trago; without a cast you do not see thorn_in_paw.</text>
</svg>
