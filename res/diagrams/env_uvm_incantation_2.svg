<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 404" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Anatomía del factory override con set_type_override()</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
  </marker>
</defs>
<text x="47" y="92" font-size="21" font-family="IBM Plex Mono, ui-monospace, monospace" xml:space="preserve"><tspan fill="#e7ad52">base_tester</tspan><tspan fill="#f0f0f0">::type_id::set_type_override(</tspan><tspan fill="#e7ad52">add_tester</tspan><tspan fill="#f0f0f0">::get_type());</tspan></text>

<path d="M47,114 H186" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<path d="M116,114 V146" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="130" y="152" fill="#8d8d8d" font-size="18">el tipo que el env le pide a la factory</text>
<path d="M551,114 H677" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<path d="M614,114 V184" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="600" y="190" text-anchor="end" fill="#8d8d8d" font-size="18">el tipo que la factory devuelve</text>

<!-- efecto -->
<rect x="30" y="240" width="250" height="86" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="155" y="272" text-anchor="middle" fill="#8d8d8d" font-size="17">env pide</text>
<text x="155" y="300" text-anchor="middle" fill="#f0f0f0" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace">base_tester</text>

<path d="M288,283 H322" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>

<rect x="330" y="240" width="240" height="86" rx="4" fill="#e7ad52" fill-opacity="0.12" stroke="#e7ad52" stroke-width="2"/>
<text x="450" y="272" text-anchor="middle" fill="#e7ad52" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace">uvm_factory</text>
<text x="450" y="300" text-anchor="middle" fill="#8d8d8d" font-size="17">con el override puesto</text>

<path d="M578,283 H612" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>

<rect x="620" y="240" width="250" height="86" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="745" y="272" text-anchor="middle" fill="#8d8d8d" font-size="17">env recibe</text>
<text x="745" y="300" text-anchor="middle" fill="#f0f0f0" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace">add_tester</text>

<text x="30" y="376" fill="#8d8d8d" font-size="17">El override se pone en el build_phase del test, antes de que corra el build_phase del env.</text>
</svg>
