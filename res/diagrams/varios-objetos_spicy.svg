<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 478" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Wiring of the dice example: roll_ap against the three analysis_export</title>
<defs>
  <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#e7ad52"/>
  </marker>
</defs>

<!-- los tres subscribers -->
<rect x="30" y="24" width="250" height="110" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="30" y="24" width="250" height="110" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="155" y="74" text-anchor="middle" fill="#f0f0f0" font-size="23" font-family="IBM Plex Mono, ui-monospace, monospace">coverage_h</text>
<text x="155" y="102" text-anchor="middle" fill="#8d8d8d" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace">uvm_subscriber #(int)</text>

<rect x="325" y="24" width="250" height="110" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="325" y="24" width="250" height="110" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="450" y="74" text-anchor="middle" fill="#f0f0f0" font-size="23" font-family="IBM Plex Mono, ui-monospace, monospace">histogram_h</text>
<text x="450" y="102" text-anchor="middle" fill="#8d8d8d" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace">uvm_subscriber #(int)</text>

<rect x="620" y="24" width="250" height="110" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="620" y="24" width="250" height="110" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="745" y="74" text-anchor="middle" fill="#f0f0f0" font-size="23" font-family="IBM Plex Mono, ui-monospace, monospace">average_h</text>
<text x="745" y="102" text-anchor="middle" fill="#8d8d8d" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace">uvm_subscriber #(int)</text>

<!-- el productor -->
<rect x="325" y="278" width="250" height="112" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="325" y="278" width="250" height="112" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="450" y="328" text-anchor="middle" fill="#f0f0f0" font-size="23" font-family="IBM Plex Mono, ui-monospace, monospace">dice_roller_h</text>
<text x="450" y="356" text-anchor="middle" fill="#8d8d8d" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace">uvm_component</text>

<!-- un solo write() sale a los tres exports -->
<path d="M450,267 V205" fill="none" stroke="#e7ad52" stroke-width="2"/>
<path d="M155,205 H745" fill="none" stroke="#e7ad52" stroke-width="2"/>
<path d="M155,205 V143" fill="none" stroke="#e7ad52" stroke-width="2" marker-end="url(#a-acc)"/>
<path d="M450,205 V143" fill="none" stroke="#e7ad52" stroke-width="2" marker-end="url(#a-acc)"/>
<path d="M745,205 V143" fill="none" stroke="#e7ad52" stroke-width="2" marker-end="url(#a-acc)"/>
<circle cx="450" cy="205" r="4" fill="#e7ad52"/>

<path d="M450,267 L461,278 L450,289 L439,278 z" fill="#e7ad52"/>
<circle cx="155" cy="134" r="9" fill="#e7ad52"/>
<circle cx="450" cy="134" r="9" fill="#e7ad52"/>
<circle cx="745" cy="134" r="9" fill="#e7ad52"/>

<text x="468" y="162" fill="#e7ad52" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">analysis_export</text>
<text x="468" y="250" fill="#e7ad52" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">roll_ap.write(the_roll)</text>

<!-- como se atan -->
<text x="30" y="430" fill="#8d8d8d" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">connect_phase: roll_ap.connect(coverage_h.analysis_export)</text>
<text x="30" y="458" fill="#8d8d8d" font-size="18">A single write() on roll_ap reaches all three: the producer does not know who listens.</text>
</svg>
