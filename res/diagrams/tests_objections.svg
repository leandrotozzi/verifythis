<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Línea de tiempo de una objection: raise, estímulo, drop, drain_time y fin de la fase, con las transacciones en vuelo</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
  </marker>
  <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#e7ad52"/>
  </marker>
</defs>

<!-- la ventana de drain, atras de todo -->
<rect x="560" y="100" width="140" height="290" fill="#e7ad52" opacity="0.08"/>
<g stroke="#e7ad52" stroke-width="2" stroke-dasharray="6 5">
  <path d="M700,100 V390"/>
</g>

<!-- los dos instantes que decide el test -->
<g stroke="#e7ad52" stroke-width="2">
  <path d="M190,100 V390"/>
  <path d="M560,100 V390"/>
</g>
<text x="190" y="90" text-anchor="middle" fill="#e7ad52" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">raise_objection</text>
<text x="560" y="90" text-anchor="middle" fill="#e7ad52" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">drop_objection</text>
<text x="760" y="90" text-anchor="middle" fill="#74e685" font-size="17">fin de la fase</text>

<!-- carril del test -->
<text x="170" y="152" text-anchor="end" fill="#f0f0f0" font-size="18">el test</text>
<rect x="190" y="128" width="370" height="34" rx="4" fill="#e7ad52" fill-opacity="0.14" stroke="#e7ad52" stroke-width="2"/>
<text x="375" y="152" text-anchor="middle" fill="#e7ad52" font-size="17">el estímulo: mil operaciones</text>

<!-- carril del scoreboard -->
<text x="170" y="252" text-anchor="end" fill="#f0f0f0" font-size="18">el scoreboard</text>
<text x="170" y="276" text-anchor="end" fill="#8d8d8d" font-size="15">compara de a una</text>
<g fill="#74e685" fill-opacity="0.55">
  <rect x="236" y="236" width="22" height="22" rx="3"/>
  <rect x="306" y="236" width="22" height="22" rx="3"/>
  <rect x="376" y="236" width="22" height="22" rx="3"/>
  <rect x="446" y="236" width="22" height="22" rx="3"/>
  <rect x="516" y="236" width="22" height="22" rx="3"/>
</g>
<g fill="none" stroke="#e7ad52" stroke-width="2">
  <rect x="586" y="236" width="22" height="22" rx="3"/>
  <rect x="626" y="236" width="22" height="22" rx="3"/>
  <rect x="666" y="236" width="22" height="22" rx="3"/>
</g>
<text x="637" y="222" text-anchor="middle" fill="#e7ad52" font-size="16">en vuelo</text>
<path d="M637,282 V318" fill="none" stroke="#e7ad52" stroke-width="2" marker-start="url(#a-acc)"/>
<text x="637" y="340" text-anchor="middle" fill="#8d8d8d" font-size="14">el DUT no contestó</text>

<!-- el eje -->
<path d="M60,390 H860" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<text x="630" y="414" text-anchor="middle" fill="#e7ad52" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">drain_time</text>
<text x="860" y="414" text-anchor="end" fill="#8d8d8d" font-size="16">tiempo de simulación</text>

<text x="40" y="456" fill="#8d8d8d" font-size="17">La objection mide el estímulo, no el análisis: al caer la última, la fase corta <tspan fill="#f0f0f0">en ese instante</tspan>.</text>
<text x="40" y="482" fill="#8d8d8d" font-size="17">Sin el colchón, esas tres no se comparan y el resumen dice <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#f0f0f0">UVM_ERROR : 0</tspan>.</text>
</svg>
