<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Anatomia de una property: label, reloj, guarda, antecedente, implicacion, consecuente y accion</title>
<defs>
  <marker id="p-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
  </marker>
</defs>

<text x="30" y="42" fill="#f0f0f0" font-size="24">Anatomía de una property</text>
<text x="30" y="66" fill="#8d8d8d" font-size="15">las siete partes son siempre las mismas; lo que cambia es qué se pone en cada una</text>

<rect x="30" y="88" width="840" height="384" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#5b6b7a" stroke-width="2"/>

<!-- 1. label -->
<text x="52" y="132" fill="#e7ad52" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">a_done_llega :</text>
<path d="M300,126 H470" stroke="#5b6b7a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#p-a)"/>
<text x="484" y="131" fill="#8d8d8d" font-size="15">el label · sale en el mensaje de error</text>

<!-- 2. reloj -->
<text x="52" y="180" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">assert property (<tspan fill="#e7ad52">@(posedge clk)</tspan></text>
<path d="M420,174 H470" stroke="#5b6b7a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#p-a)"/>
<text x="484" y="179" fill="#8d8d8d" font-size="15">el reloj · <tspan fill="#f0f0f0">cuándo se muestrea</tspan></text>

<!-- 3. disable iff -->
<text x="82" y="228" fill="#e7ad52" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">disable iff (!reset_n)</text>
<path d="M380,222 H470" stroke="#5b6b7a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#p-a)"/>
<text x="484" y="227" fill="#8d8d8d" font-size="15">cuándo <tspan fill="#f0f0f0">no</tspan> chequear</text>

<!-- 4. antecedente -->
<text x="82" y="276" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">start &amp;&amp; (op_set != no_op)</text>
<path d="M400,270 H470" stroke="#5b6b7a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#p-a)"/>
<text x="484" y="275" fill="#8d8d8d" font-size="15">el antecedente · el <tspan fill="#f0f0f0">«si»</tspan></text>

<!-- 5. implicacion -->
<text x="82" y="324" fill="#74e685" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">|-&gt;</text>
<path d="M140,318 H470" stroke="#5b6b7a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#p-a)"/>
<text x="484" y="323" fill="#8d8d8d" font-size="15">la implicación · el mismo flanco</text>
<text x="484" y="343" fill="#5f5f5f" font-size="14">con <tspan font-family="IBM Plex Mono, ui-monospace, monospace">|=&gt;</tspan> es el flanco siguiente</text>

<!-- 6. consecuente -->
<text x="82" y="382" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">##[1:5] done</text>
<path d="M280,376 H470" stroke="#5b6b7a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#p-a)"/>
<text x="484" y="381" fill="#8d8d8d" font-size="15">el consecuente · el <tspan fill="#f0f0f0">«entonces»</tspan></text>

<!-- 7. accion -->
<text x="52" y="440" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">) else <tspan fill="#e7ad52">`uvm_error("SVA", …)</tspan>;</text>
<path d="M420,434 H470" stroke="#5b6b7a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#p-a)"/>
<text x="484" y="439" fill="#8d8d8d" font-size="15">la acción · para que <tspan fill="#f0f0f0">cuente</tspan> en el Report Summary</text>

<!-- pie: el muestreo -->
<rect x="30" y="492" width="840" height="46" rx="6" fill="#e7ad52" fill-opacity="0.10" stroke="#e7ad52" stroke-width="2"/>
<text x="50" y="512" fill="#e7ad52" font-size="15">Una assertion vale lo que vale su muestreo</text>
<text x="50" y="530" fill="#8d8d8d" font-size="14">estímulo → <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#f0f0f0">@(negedge clk)</tspan>, donde la BFM escribe   ·   respuesta del DUT → <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#f0f0f0">@(posedge clk)</tspan>, donde el DUT registra</text>
</svg>
