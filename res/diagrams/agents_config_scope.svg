<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>El ambito jerarquico del uvm_config_db: el mismo string, distinto objeto</title>
<defs>
  <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#e7ad52"/>
  </marker>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
  </marker>
</defs>

<!-- lo que hace el env -->
<rect x="40" y="20" width="820" height="150" rx="6" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="7 6"/>
<text x="58" y="46" fill="#8d8d8d" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">env :: build_phase()</text>

<text x="58" y="92" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace"><tspan fill="#f0f0f0">uvm_config_db#(vtalu_agent_config)::set(this, </tspan><tspan fill="#e7ad52">"clase_agent_h*"</tspan><tspan fill="#f0f0f0">, "config", clase_cfg_h);</tspan></text>
<text x="58" y="128" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace"><tspan fill="#f0f0f0">uvm_config_db#(vtalu_agent_config)::set(this, </tspan><tspan fill="#e7ad52">"modulo_agent_h*"</tspan><tspan fill="#f0f0f0">, "config", modulo_cfg_h);</tspan></text>

<path d="M52,88 H26 V232 H84" fill="none" stroke="#e7ad52" stroke-width="2" marker-end="url(#a-acc)"/>
<path d="M826,124 H874 V232 H816" fill="none" stroke="#e7ad52" stroke-width="2" marker-end="url(#a-acc)"/>

<!-- los dos agents -->
<rect x="90" y="200" width="300" height="64" rx="4" fill="#e7ad52" fill-opacity="0.12"/>
<rect x="90" y="200" width="300" height="64" rx="4" fill="none" stroke="#e7ad52" stroke-width="2"/>
<text x="240" y="228" fill="#e7ad52" font-size="20" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">clase_agent_h</text>
<text x="240" y="252" fill="#8d8d8d" font-size="14" text-anchor="middle">clase_bfm · UVM_ACTIVE</text>

<rect x="510" y="200" width="300" height="64" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="510" y="200" width="300" height="64" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="660" y="228" fill="#f0f0f0" font-size="20" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">modulo_agent_h</text>
<text x="660" y="252" fill="#8d8d8d" font-size="14" text-anchor="middle">modulo_bfm · UVM_PASSIVE</text>

<path d="M240,264 V322" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<path d="M660,264 V322" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>

<!-- la linea que los dos ejecutan -->
<rect x="180" y="330" width="540" height="104" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="180" y="330" width="540" height="104" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="450" y="360" fill="#8d8d8d" font-size="17" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">vtalu_agent :: build_phase()</text>
<text x="450" y="392" fill="#e7ad52" font-size="16" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">::get(this, "", "config", cfg)</text>
<text x="450" y="418" fill="#8d8d8d" font-size="15" text-anchor="middle">la misma línea en los dos, con el mismo string</text>

<text x="450" y="470" fill="#f0f0f0" font-size="18" text-anchor="middle">El ámbito del <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#e7ad52">set()</tspan> es la ruta del componente que va a leer, no un nombre libre.</text>
<text x="450" y="498" fill="#8d8d8d" font-size="17" text-anchor="middle">Con <tspan font-family="IBM Plex Mono, ui-monospace, monospace">"*"</tspan> en las dos, el segundo pisa al primero y los dos agents arrancan activos.</text>
</svg>
