<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Jerarquía de instancias que UVM arma en build_phase</title>

<g fill="none" stroke="#5b6b7a" stroke-width="2">
  <path d="M450,62 V88"/>
  <path d="M450,134 V160"/>
  <path d="M450,206 V224"/>
  <path d="M126,224 H774"/>
  <path d="M126,224 V238 M342,224 V238 M558,224 V238 M774,224 V238"/>
  <path d="M234,224 V296"/>
  <path d="M126,296 H558"/>
  <path d="M126,296 V310 M342,296 V310 M558,296 V310"/>
</g>

<rect x="350" y="20" width="200" height="42" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="450" y="49" text-anchor="middle" fill="#f0f0f0" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">uvm_top</text>
<text x="330" y="47" text-anchor="end" fill="#8d8d8d" font-size="17">no aparece en la ruta</text>

<rect x="310" y="88" width="280" height="46" rx="4" fill="#e7ad52" fill-opacity="0.12" stroke="#e7ad52" stroke-width="2"/>
<text x="450" y="119" text-anchor="middle" fill="#e7ad52" font-size="24" font-family="IBM Plex Mono, ui-monospace, monospace">uvm_test_top</text>
<text x="612" y="105" fill="#8d8d8d" font-size="17">así lo nombra run_test(),</text>
<text x="612" y="127" fill="#8d8d8d" font-size="17">la clase es random_test</text>

<rect x="310" y="160" width="280" height="46" rx="4" fill="#e7ad52" fill-opacity="0.12" stroke="#e7ad52" stroke-width="2"/>
<text x="450" y="191" text-anchor="middle" fill="#e7ad52" font-size="24" font-family="IBM Plex Mono, ui-monospace, monospace">env_h</text>
<text x="612" y="189" fill="#8d8d8d" font-size="17">lo crea el build_phase del test</text>

<!-- los siete hijos del env: el septimo es command_f, la TLM FIFO -->
<rect x="28" y="238" width="196" height="44" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="126" y="266" text-anchor="middle" fill="#f0f0f0" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">command_f</text>

<rect x="244" y="238" width="196" height="44" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="342" y="266" text-anchor="middle" fill="#f0f0f0" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">random_tester_h</text>

<rect x="460" y="238" width="196" height="44" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="558" y="266" text-anchor="middle" fill="#f0f0f0" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">driver_h</text>

<rect x="676" y="238" width="196" height="44" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="774" y="266" text-anchor="middle" fill="#f0f0f0" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">command_monitor_h</text>

<rect x="28" y="310" width="196" height="44" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="126" y="338" text-anchor="middle" fill="#f0f0f0" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">result_monitor_h</text>

<rect x="244" y="310" width="196" height="44" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="342" y="338" text-anchor="middle" fill="#f0f0f0" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">coverage_h</text>

<!-- el scoreboard tiene su propia FIFO adentro, y tambien sale en el arbol -->
<rect x="460" y="310" width="196" height="86" rx="4" fill="#e7ad52" fill-opacity="0.12" stroke="#e7ad52" stroke-width="2"/>
<text x="558" y="338" text-anchor="middle" fill="#e7ad52" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">scoreboard_h</text>
<rect x="474" y="350" width="168" height="34" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="558" y="373" text-anchor="middle" fill="#f0f0f0" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace">cmd_f</text>

<text x="676" y="326" fill="#8d8d8d" font-size="15">command_f y cmd_f son</text>
<text x="676" y="348" fill="#8d8d8d" font-size="15">uvm_tlm_fifo, que extiende</text>
<text x="676" y="370" fill="#8d8d8d" font-size="15">uvm_component: por eso</text>
<text x="676" y="392" fill="#8d8d8d" font-size="15">print_topology() las imprime</text>

<rect x="40" y="414" width="820" height="76" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#444" stroke-width="2"/>
<text x="64" y="444" fill="#8d8d8d" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">UVM_ERROR tb_classes/scoreboard.svh(39) @ 290:</text>
<text x="64" y="476" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace"><tspan fill="#e7ad52">uvm_test_top.env_h.scoreboard_h</tspan><tspan fill="#f0f0f0"> [SCOREBOARD] FAIL: 5b add_op ff</tspan></text>

<text x="40" y="518" fill="#8d8d8d" font-size="18">Ese prefijo es la ruta del componente dentro del árbol.</text>
</svg>
