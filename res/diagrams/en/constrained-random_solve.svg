<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>The 257 solutions of solve-before: the solver draws solutions, not values of each field</title>
<defs>
  <pattern id="celdas" width="14" height="14" patternUnits="userSpaceOnUse">
    <path d="M14,0 V14 M0,14 H14" fill="none" stroke="#5b6b7a" stroke-width="1" opacity="0.55"/>
  </pattern>
  <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#e7ad52"/>
  </marker>
</defs>

<text x="40" y="48" fill="#8d8d8d" font-size="18">One cell, one solution. The draw is uniform over <tspan fill="#f0f0f0">all of them</tspan>:</text>

<!-- la unica solucion con reset -->
<text x="190" y="140" text-anchor="middle" fill="#e7ad52" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">es_reset = 1</text>
<circle cx="190" cy="250" r="34" fill="none" stroke="#e7ad52" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="183" y="243" width="14" height="14" fill="#e7ad52"/>
<path d="M190,178 V208" fill="none" stroke="#e7ad52" stroke-width="2" marker-end="url(#a-acc)"/>
<text x="190" y="322" text-anchor="middle" fill="#e7ad52" font-size="19">1 solution</text>
<text x="190" y="346" text-anchor="middle" fill="#8d8d8d" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace">A == 8'h00</text>

<!-- las 256 sin reset -->
<text x="532" y="140" text-anchor="middle" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">es_reset = 0</text>
<rect x="420" y="168" width="224" height="224" fill="#5b6b7a" fill-opacity="0.16"/>
<rect x="420" y="168" width="224" height="224" fill="url(#celdas)"/>
<rect x="420" y="168" width="224" height="224" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="700" y="262" fill="#f0f0f0" font-size="19">256 solutions</text>
<text x="700" y="288" fill="#8d8d8d" font-size="16"><tspan font-family="IBM Plex Mono, ui-monospace, monospace">A</tspan> is left free</text>

<text x="40" y="434" fill="#8d8d8d" font-size="17">The solver picks among the <tspan fill="#f0f0f0">257 solutions</tspan>, not between the two values of <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#f0f0f0">es_reset</tspan>.</text>
<text x="40" y="460" fill="#8d8d8d" font-size="17">You asked for reset half the time and you will see it 1 in 257. Measured: <tspan fill="#e7ad52">0.3 %</tspan>.</text>
</svg>
