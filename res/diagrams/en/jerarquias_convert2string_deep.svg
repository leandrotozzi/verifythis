<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>A new level in the hierarchy breaks convert2string()</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
  <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e7ad52"/></marker>
</defs>

<text x="40" y="34" fill="#8d8d8d" font-size="19">class hierarchy</text>
<path d="M262,28 H512" fill="none" stroke="#8d8d8d" stroke-width="2" marker-end="url(#a)"/>
<text x="520" y="34" fill="#8d8d8d" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">convert2string()</text>

<!-- el string que devuelve el objeto mas derivado -->
<rect x="520" y="56" width="346" height="376" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="520" y="56" width="346" height="376" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<path d="M534,124 H852" stroke="#333" stroke-width="1"/>
<path d="M534,204 H852" stroke="#333" stroke-width="1"/>
<path d="M534,284 H852" stroke="#333" stroke-width="1"/>
<path d="M534,364 H852" stroke="#333" stroke-width="1"/>
<text x="540" y="91" fill="#f0f0f0" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace">Hielos: 2</text>
<text x="540" y="251" fill="#f0f0f0" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace">Coca: si</text>
<text x="540" y="331" fill="#f0f0f0" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace">Mesa: mesa 4</text>
<text x="540" y="411" fill="#f0f0f0" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace">medidas: 2</text>

<!-- jerarquía: la flecha apunta a la clase padre -->
<rect x="40" y="56" width="300" height="56" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="40" y="56" width="300" height="56" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="56" y="81" fill="#f0f0f0" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">trago</text>
<text x="56" y="102" fill="#8d8d8d" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">+ hielos : int</text>
<rect x="40" y="136" width="300" height="56" rx="4" fill="#e7ad52" fill-opacity="0.09" stroke="#e7ad52" stroke-width="2"/>
<text x="56" y="161" fill="#e7ad52" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">con_alcohol</text>
<text x="56" y="182" fill="#e7ad52" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">+ graduacion : int</text>
<path d="M190,133 V116" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="216" width="300" height="56" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="40" y="216" width="300" height="56" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="56" y="241" fill="#f0f0f0" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">fernet</text>
<text x="56" y="262" fill="#8d8d8d" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">+ con_coca : bit</text>
<path d="M190,213 V196" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="296" width="300" height="56" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="40" y="296" width="300" height="56" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="56" y="321" fill="#f0f0f0" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">fernet_doble</text>
<text x="56" y="342" fill="#8d8d8d" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">+ mesa : string</text>
<path d="M190,293 V276" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="376" width="300" height="56" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="40" y="376" width="300" height="56" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="56" y="401" fill="#f0f0f0" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">fernet_con_hielo</text>
<text x="56" y="422" fill="#8d8d8d" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">+ medidas : byte</text>
<path d="M190,373 V356" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>

<!-- el campo que nunca llega al string -->
<path d="M348,164 H510" fill="none" stroke="#e7ad52" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a-acc)"/>
<rect x="534" y="138" width="318" height="52" rx="4" fill="none" stroke="#e7ad52" stroke-width="2" stroke-dasharray="6 6"/>
<text x="550" y="158" fill="#e7ad52" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">graduacion</text>
<text x="550" y="180" fill="#e7ad52" font-size="17">does not show up in the string</text>

<text x="40" y="468" fill="#8d8d8d" font-size="17">fernet lists the fields by hand: it does not know con_alcohol exists. The fix is super.convert2string().</text>
</svg>
