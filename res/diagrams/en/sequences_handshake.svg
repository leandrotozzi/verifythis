<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 76 900 444" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Handshake between the sequence and the driver: start_item, get_next_item, item_done and finish_item</title>
<defs>
  <marker id="h-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
  </marker>
  <marker id="h-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#e7ad52"/>
  </marker>
</defs>

<!-- verticales de los eventos -->
<g stroke="#2e2e2e" stroke-width="1" stroke-dasharray="2 5">
  <path d="M210,84 V404"/>
  <path d="M350,84 V404"/>
  <path d="M500,84 V404"/>
  <path d="M540,84 V404"/>
  <path d="M790,84 V404"/>
</g>

<!-- ================= carril de la sequence ================= -->
<text x="176" y="110" text-anchor="end" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">reset_sequence</text>
<text x="176" y="131" text-anchor="end" fill="#8d8d8d" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace">body()</text>

<rect x="210" y="90" width="140" height="42" rx="3" fill="#ffffff" opacity="0.04"/>
<rect x="210" y="90" width="140" height="42" rx="3" fill="none" stroke="#5b6b7a" stroke-width="2" stroke-dasharray="5 4"/>
<text x="280" y="117" text-anchor="middle" fill="#8d8d8d" font-size="15">blocked</text>

<rect x="350" y="90" width="150" height="42" rx="3" fill="#e7ad52" opacity="0.14"/>
<rect x="350" y="90" width="150" height="42" rx="3" fill="none" stroke="#e7ad52" stroke-width="2"/>
<text x="425" y="109" text-anchor="middle" fill="#e7ad52" font-size="14">fills the item</text>
<text x="425" y="126" text-anchor="middle" fill="#e7ad52" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace">cmd.op = rst_op</text>

<rect x="500" y="90" width="290" height="42" rx="3" fill="#ffffff" opacity="0.04"/>
<rect x="500" y="90" width="290" height="42" rx="3" fill="none" stroke="#5b6b7a" stroke-width="2" stroke-dasharray="5 4"/>
<text x="645" y="117" text-anchor="middle" fill="#8d8d8d" font-size="15">blocked</text>

<path d="M796,111 H862" fill="none" stroke="#e7ad52" stroke-width="2" marker-end="url(#h-a)"/>
<text x="798" y="102" fill="#e7ad52" font-size="14">body() ends</text>

<!-- ================= banda del sequencer ================= -->
<text x="176" y="228" text-anchor="end" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">sequencer_h</text>
<text x="176" y="249" text-anchor="end" fill="#8d8d8d" font-size="15">arbitrates</text>
<rect x="190" y="204" width="670" height="52" rx="4" fill="#ffffff" opacity="0.05"/>
<rect x="190" y="204" width="670" height="52" rx="4" fill="none" stroke="#444" stroke-width="2"/>
<circle cx="350" cy="230" r="8" fill="#e7ad52"/>
<text x="350" y="278" text-anchor="middle" fill="#e7ad52" font-size="14">gives it the turn</text>

<!-- ================= carril del driver ================= -->
<text x="176" y="352" text-anchor="end" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">driver_h</text>
<text x="176" y="373" text-anchor="end" fill="#8d8d8d" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace">run_phase()</text>

<rect x="190" y="330" width="350" height="42" rx="3" fill="#ffffff" opacity="0.04"/>
<rect x="190" y="330" width="350" height="42" rx="3" fill="none" stroke="#5b6b7a" stroke-width="2" stroke-dasharray="5 4"/>
<text x="365" y="357" text-anchor="middle" fill="#8d8d8d" font-size="15">blocked</text>

<rect x="540" y="330" width="250" height="42" rx="3" fill="#e7ad52" opacity="0.14"/>
<rect x="540" y="330" width="250" height="42" rx="3" fill="none" stroke="#e7ad52" stroke-width="2"/>
<text x="665" y="349" text-anchor="middle" fill="#e7ad52" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace">send_op()</text>
<text x="665" y="366" text-anchor="middle" fill="#e7ad52" font-size="14">time passes here</text>

<!-- ================= transferencias ================= -->
<path d="M210,136 V200" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#h-s)"/>
<text x="216" y="162" fill="#f0f0f0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace">start_item(cmd)</text>

<path d="M350,200 V136" fill="none" stroke="#e7ad52" stroke-width="2" marker-end="url(#h-a)"/>

<path d="M500,136 V200" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#h-s)"/>
<text x="506" y="186" fill="#f0f0f0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace">finish_item(cmd)</text>

<path d="M205,326 V260" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#h-s)"/>
<text x="211" y="298" fill="#f0f0f0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace">get_next_item(cmd)</text>
<text x="211" y="316" fill="#8d8d8d" font-size="14">the driver calls and blocks</text>

<path d="M540,260 V326" fill="none" stroke="#e7ad52" stroke-width="2" marker-end="url(#h-a)"/>
<text x="546" y="282" fill="#e7ad52" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace">get_next_item()</text>
<text x="546" y="300" fill="#e7ad52" font-size="14">returns with cmd</text>

<path d="M790,326 V260" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#h-s)"/>
<text x="782" y="316" text-anchor="end" fill="#f0f0f0" font-size="14" font-family="IBM Plex Mono, ui-monospace, monospace">item_done()</text>

<path d="M790,200 V136" fill="none" stroke="#e7ad52" stroke-width="2" marker-end="url(#h-a)"/>
<text x="782" y="186" text-anchor="end" fill="#e7ad52" font-size="15">returns</text>

<!-- ================= pie ================= -->
<path d="M190,424 H852" stroke="#333" stroke-width="1" marker-end="url(#h-s)"/>
<text x="852" y="446" text-anchor="end" fill="#8d8d8d" font-size="15">simulation time</text>

<text x="30" y="480" fill="#8d8d8d" font-size="17">Time only advances on the amber driver bar: filling the item costs no edge.</text>
<text x="30" y="504" fill="#8d8d8d" font-size="17">Without the <tspan fill="#e7ad52" font-family="IBM Plex Mono, ui-monospace, monospace">item_done()</tspan>, the sequence stays in <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#f0f0f0">finish_item()</tspan> forever.</text>
</svg>
