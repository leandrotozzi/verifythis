<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 900 480" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>One sequence starting three sub-sequences on the same sequencer</title>
<defs>
  <marker id="s-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#e7ad52"/>
  </marker>
  <marker id="s-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
  </marker>
</defs>

<!-- ============ la sequence madre ============ -->
<rect x="30" y="130" width="240" height="180" rx="4" fill="#e7ad52" fill-opacity="0.14" stroke="#e7ad52" stroke-width="2"/>
<text x="150" y="166" text-anchor="middle" fill="#e7ad52" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace">full_sequence</text>
<text x="150" y="190" text-anchor="middle" fill="#8d8d8d" font-size="15">sends no item of its own</text>
<text x="52" y="228" fill="#f0f0f0" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">task body();</text>
<text x="66" y="252" fill="#8d8d8d" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace">reset_seq.start()</text>
<text x="66" y="274" fill="#8d8d8d" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace">random_seq.start()</text>
<text x="66" y="296" fill="#8d8d8d" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace">maxmult_seq.start()</text>

<!-- ============ las tres hijas ============ -->
<rect x="340" y="60" width="230" height="60" rx="4" fill="#e7ad52" fill-opacity="0.09" stroke="#e7ad52" stroke-width="2"/>
<text x="455" y="88" text-anchor="middle" fill="#e7ad52" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">reset_sequence</text>
<text x="455" y="109" text-anchor="middle" fill="#8d8d8d" font-size="15">1 item</text>

<rect x="340" y="190" width="230" height="60" rx="4" fill="#e7ad52" fill-opacity="0.09" stroke="#e7ad52" stroke-width="2"/>
<text x="455" y="218" text-anchor="middle" fill="#e7ad52" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">random_sequence</text>
<text x="455" y="239" text-anchor="middle" fill="#8d8d8d" font-size="15">1000 randomized items</text>

<rect x="340" y="320" width="230" height="60" rx="4" fill="#e7ad52" fill-opacity="0.09" stroke="#e7ad52" stroke-width="2"/>
<text x="455" y="348" text-anchor="middle" fill="#e7ad52" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">maxmult_sequence</text>
<text x="455" y="369" text-anchor="middle" fill="#8d8d8d" font-size="15">1 directed item: FF × FF</text>

<!-- llamadas madre -> hijas -->
<g fill="none" stroke="#e7ad52" stroke-width="2" marker-end="url(#s-a)">
  <path d="M276,222 H306 V90 H331"/>
  <path d="M276,262 H331"/>
  <path d="M276,294 H306 V350 H331"/>
</g>
<g fill="#e7ad52" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">
  <text x="312" y="82">1</text>
  <text x="312" y="254">2</text>
  <text x="312" y="342">3</text>
</g>

<!-- ============ el embudo ============ -->
<g fill="none" stroke="#e7ad52" stroke-width="2" marker-end="url(#s-a)">
  <path d="M576,90 H612 V208 H641"/>
  <path d="M576,220 H641"/>
  <path d="M576,350 H612 V232 H641"/>
</g>

<rect x="650" y="188" width="220" height="64" rx="4" fill="#e7ad52" fill-opacity="0.14" stroke="#e7ad52" stroke-width="2"/>
<text x="760" y="216" text-anchor="middle" fill="#e7ad52" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">sequencer_h</text>
<text x="760" y="238" text-anchor="middle" fill="#8d8d8d" font-size="15">arbitrates: one item at a time</text>
<circle cx="650" cy="220" r="9" fill="#e7ad52"/>

<path d="M760,256 V292" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#s-s)"/>
<rect x="650" y="296" width="220" height="56" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="760" y="330" text-anchor="middle" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">driver_h</text>
<rect x="749" y="285" width="22" height="22" fill="#5b6b7a"/>

<path d="M760,356 V388" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#s-s)"/>
<rect x="650" y="392" width="220" height="46" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="760" y="421" text-anchor="middle" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">vtalu_bfm</text>

<!-- ============ pie ============ -->
<text x="284" y="416" fill="#e7ad52" font-size="16" font-family="IBM Plex Mono, ui-monospace, monospace">start(get_sequencer(), this)</text>
<text x="284" y="438" fill="#8d8d8d" font-size="15">the second argument declares them children</text>

<text x="30" y="480" fill="#8d8d8d" font-size="17">In series, as drawn.</text>
<text x="30" y="504" fill="#8d8d8d" font-size="17">With <tspan fill="#f0f0f0" font-family="IBM Plex Mono, ui-monospace, monospace">fork</tspan> / <tspan fill="#f0f0f0" font-family="IBM Plex Mono, ui-monospace, monospace">join</tspan> around the <tspan fill="#f0f0f0" font-family="IBM Plex Mono, ui-monospace, monospace">start()</tspan>, the sequencer interleaves the items.</text>
</svg>
