<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 505" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>random_test and add_test write the same build_phase()</title>
<rect x="340" y="14" width="220" height="44" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="450" y="43" text-anchor="middle" fill="#f0f0f0" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">uvm_test</text>

<g fill="none" stroke="#5b6b7a" stroke-width="2">
  <path d="M450,58 V88"/>
  <path d="M310,198 V238"/>
</g>

<rect x="120" y="88" width="380" height="110" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="310" y="116" text-anchor="middle" fill="#f0f0f0" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">random_test</text>
<path d="M120,126 H500" stroke="#5b6b7a" stroke-width="2"/>
<text x="136" y="152" fill="#8d8d8d" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">tester_h : random_tester</text>
<text x="136" y="180" fill="#e7ad52" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">build_phase()</text>

<rect x="120" y="238" width="380" height="110" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="310" y="266" text-anchor="middle" fill="#f0f0f0" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">add_test</text>
<path d="M120,276 H500" stroke="#5b6b7a" stroke-width="2"/>
<text x="136" y="302" fill="#8d8d8d" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">tester_h : add_tester</text>
<text x="136" y="330" fill="#e7ad52" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">build_phase()</text>

<!-- el build_phase repetido: la duplicacion que el env resuelve con el factory override -->
<path d="M504,180 H536 V330 H504" fill="none" stroke="#e7ad52" stroke-width="2" stroke-dasharray="6 5"/>
<text x="552" y="240" fill="#e7ad52" font-size="19">duplicated</text>
<text x="552" y="266" fill="#8d8d8d" font-size="17">the same build_phase()</text>
<text x="552" y="288" fill="#8d8d8d" font-size="17">in both tests</text>

<text x="40" y="406" fill="#8d8d8d" font-size="17">add_test inherits from random_test and rewrites its whole build_phase: the three new() calls are identical.</text>
<text x="40" y="436" fill="#8d8d8d" font-size="17">The testers, on the other hand, duplicate nothing: add_tester extends random_tester and only overrides get_op().</text>
<text x="40" y="466" fill="#8d8d8d" font-size="17">run_phase() is written once, in random_tester, and add_tester inherits it.</text>
</svg>
