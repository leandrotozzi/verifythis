<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>The coverage closure cycle: randomize, read the report, fill the missing bin and start again</title>
<defs>
  <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#e7ad52"/>
  </marker>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
  </marker>
</defs>

<!-- el ciclo -->
<g fill="none" stroke="#e7ad52" stroke-width="2">
  <path d="M320,116 H556" marker-end="url(#a-acc)"/>
  <path d="M690,166 V296" marker-end="url(#a-acc)"/>
  <path d="M560,326 H324" marker-end="url(#a-acc)"/>
  <path d="M190,296 V166" marker-end="url(#a-acc)"/>
</g>

<rect x="60" y="78" width="260" height="76" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="190" y="110" text-anchor="middle" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">randomize()</text>
<text x="190" y="136" text-anchor="middle" fill="#8d8d8d" font-size="16">the bulk, cheap</text>

<rect x="560" y="78" width="260" height="76" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="690" y="110" text-anchor="middle" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">cov_report</text>
<text x="690" y="136" text-anchor="middle" fill="#8d8d8d" font-size="16">what was left out</text>

<rect x="560" y="288" width="260" height="76" rx="4" fill="#e7ad52" fill-opacity="0.12" stroke="#e7ad52" stroke-width="2"/>
<text x="690" y="320" text-anchor="middle" fill="#e7ad52" font-size="18" font-family="IBM Plex Mono, ui-monospace, monospace">randomize() with {}</text>
<text x="690" y="346" text-anchor="middle" fill="#8d8d8d" font-size="16">the missing bin, three lines</text>

<rect x="60" y="288" width="260" height="76" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="190" y="320" text-anchor="middle" fill="#f0f0f0" font-size="19">another seed</text>
<text x="190" y="346" text-anchor="middle" fill="#8d8d8d" font-size="16">and again</text>

<!-- el atajo del medio -->
<path d="M565,218 H592 V284" fill="none" stroke="#5b6b7a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>
<rect x="335" y="180" width="230" height="76" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#444" stroke-width="2" stroke-dasharray="7 6"/>
<text x="450" y="212" text-anchor="middle" fill="#f0f0f0" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">constraint_mode(0)</text>
<text x="450" y="238" text-anchor="middle" fill="#8d8d8d" font-size="15">break a rule on purpose</text>

<text x="40" y="418" fill="#8d8d8d" font-size="17">Closing coverage is this cycle, and it is what a verification engineer spends the day on.</text>
<text x="40" y="444" fill="#8d8d8d" font-size="17">What it is <tspan fill="#f0f0f0">not</tspan>: writing one test per bin, or looking at the total percentage.</text>
</svg>
