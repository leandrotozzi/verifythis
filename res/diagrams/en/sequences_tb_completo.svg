<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>The whole testbench: the sequence cloud, the agent with sequencer and driver, and the analysis layer in the env</title>
