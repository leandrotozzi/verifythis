<!-- ============ pie ============ -->
<text x="30" y="452" fill="#8d8d8d" font-size="17">Everything in the dotted box is built once and does not change.</text>
<text x="30" y="476" fill="#8d8d8d" font-size="17">What changes between one test and another is <tspan fill="#e7ad52">the row above</tspan>.</text>
