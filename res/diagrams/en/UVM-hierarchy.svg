<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Instance hierarchy UVM builds in build_phase</title>

<g fill="none" stroke="#5b6b7a" stroke-width="2">
  <path d="M450,62 V88"/>
  <path d="M450,134 V160"/>
  <path d="M450,206 V224"/>
  <path d="M175,224 H725"/>
  <path d="M175,224 V238 M450,224 V238 M725,224 V238"/>
  <path d="M312,224 V296"/>
  <path d="M175,296 H725"/>
  <path d="M175,296 V310 M450,296 V310 M725,296 V310"/>
</g>

<rect x="350" y="20" width="200" height="42" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="450" y="49" text-anchor="middle" fill="#f0f0f0" font-size="22" font-family="IBM Plex Mono, ui-monospace, monospace">uvm_top</text>
<text x="330" y="47" text-anchor="end" fill="#8d8d8d" font-size="17">does not show up in the path</text>

<rect x="310" y="88" width="280" height="46" rx="4" fill="#e7ad52" fill-opacity="0.12" stroke="#e7ad52" stroke-width="2"/>
<text x="450" y="119" text-anchor="middle" fill="#e7ad52" font-size="24" font-family="IBM Plex Mono, ui-monospace, monospace">uvm_test_top</text>
<text x="612" y="105" fill="#8d8d8d" font-size="17">that is how run_test() names it,</text>
<text x="612" y="127" fill="#8d8d8d" font-size="17">the class is random_test</text>

<rect x="310" y="160" width="280" height="46" rx="4" fill="#e7ad52" fill-opacity="0.12" stroke="#e7ad52" stroke-width="2"/>
<text x="450" y="191" text-anchor="middle" fill="#e7ad52" font-size="24" font-family="IBM Plex Mono, ui-monospace, monospace">env_h</text>
<text x="612" y="189" fill="#8d8d8d" font-size="17">created by the test build_phase</text>

<rect x="50" y="238" width="250" height="44" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="175" y="267" text-anchor="middle" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">random_tester_h</text>

<rect x="325" y="238" width="250" height="44" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="450" y="267" text-anchor="middle" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">driver_h</text>

<rect x="600" y="238" width="250" height="44" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="725" y="267" text-anchor="middle" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">command_monitor_h</text>

<rect x="50" y="310" width="250" height="44" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="175" y="339" text-anchor="middle" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">result_monitor_h</text>

<rect x="325" y="310" width="250" height="44" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="450" y="339" text-anchor="middle" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">coverage_h</text>

<rect x="600" y="310" width="250" height="44" rx="4" fill="#e7ad52" fill-opacity="0.12" stroke="#e7ad52" stroke-width="2"/>
<text x="725" y="339" text-anchor="middle" fill="#e7ad52" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">scoreboard_h</text>

<rect x="40" y="382" width="820" height="76" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#444" stroke-width="2"/>
<text x="64" y="412" fill="#8d8d8d" font-size="17" font-family="IBM Plex Mono, ui-monospace, monospace">UVM_ERROR tb_classes/scoreboard.svh(35) @ 290:</text>
<text x="64" y="444" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace"><tspan fill="#e7ad52">uvm_test_top.env_h.scoreboard_h</tspan><tspan fill="#f0f0f0"> [SCOREBOARD] FAIL: 5b add_op ff</tspan></text>

<text x="40" y="486" fill="#8d8d8d" font-size="18">That prefix is the component path inside the tree.</text>
