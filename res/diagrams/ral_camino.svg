<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>El camino de datos de RAL: del write del modelo al bus, y del monitor al espejo por el predictor</title>
<defs>
  <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#e7ad52"/>
  </marker>
  <marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#74e685"/>
  </marker>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
  </marker>
</defs>

<!-- el atajo de la prediccion automatica -->
<text x="450" y="28" text-anchor="middle" fill="#8d8d8d" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace">set_auto_predict(1)</text>
<text x="450" y="50" text-anchor="middle" fill="#8d8d8d" font-size="15">el espejo cambia sin mirar el cable</text>
<path d="M322,86 H578" fill="none" stroke="#5b6b7a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>

<!-- arriba: la llamada y el espejo -->
<rect x="60" y="60" width="260" height="52" rx="4" fill="#e7ad52" fill-opacity="0.12" stroke="#e7ad52" stroke-width="2"/>
<text x="190" y="93" text-anchor="middle" fill="#e7ad52" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">model.CTRL.write()</text>

<rect x="580" y="60" width="260" height="52" rx="4" fill="#74e685" fill-opacity="0.12" stroke="#74e685" stroke-width="2"/>
<text x="710" y="85" text-anchor="middle" fill="#74e685" font-size="19">el espejo</text>
<text x="710" y="105" text-anchor="middle" fill="#8d8d8d" font-size="15" font-family="IBM Plex Mono, ui-monospace, monospace">get_mirrored_value()</text>

<!-- la bajada -->
<g fill="none" stroke="#e7ad52" stroke-width="2">
  <path d="M190,112 V140" marker-end="url(#a-acc)"/>
  <path d="M190,188 V210" marker-end="url(#a-acc)"/>
  <path d="M190,258 V280" marker-end="url(#a-acc)"/>
  <path d="M190,328 V350" marker-end="url(#a-acc)"/>
  <path d="M190,398 V460 H326" marker-end="url(#a-acc)"/>
</g>
<g fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2">
  <rect x="60" y="140" width="260" height="48" rx="4"/>
  <rect x="60" y="210" width="260" height="48" rx="4"/>
  <rect x="60" y="280" width="260" height="48" rx="4"/>
  <rect x="60" y="350" width="260" height="48" rx="4"/>
</g>
<text x="190" y="171" text-anchor="middle" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">default_map</text>
<text x="190" y="241" text-anchor="middle" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">adapter.reg2bus()</text>
<text x="190" y="311" text-anchor="middle" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">sequencer_h</text>
<text x="190" y="381" text-anchor="middle" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">driver_h</text>

<text x="340" y="170" fill="#8d8d8d" font-size="15">la dirección sale de acá</text>
<text x="340" y="240" fill="#8d8d8d" font-size="15">el único que sabe del APB</text>
<text x="340" y="310" fill="#8d8d8d" font-size="15">el del agent, el de siempre</text>

<!-- el DUT -->
<rect x="330" y="430" width="240" height="60" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2"/>
<text x="450" y="455" text-anchor="middle" fill="#f0f0f0" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace">DUT</text>
<text x="450" y="478" text-anchor="middle" fill="#8d8d8d" font-size="15">el cable, que es la única verdad</text>

<!-- la subida -->
<g fill="none" stroke="#74e685" stroke-width="2">
  <path d="M574,460 H710 V398" marker-end="url(#a-ok)"/>
  <path d="M710,350 V328" marker-end="url(#a-ok)"/>
  <path d="M710,280 V258" marker-end="url(#a-ok)"/>
  <path d="M710,210 V188" marker-end="url(#a-ok)"/>
  <path d="M710,140 V112" marker-end="url(#a-ok)"/>
</g>
<g fill="#ffffff" fill-opacity="0.06" stroke="#5b6b7a" stroke-width="2">
  <rect x="580" y="350" width="260" height="48" rx="4"/>
  <rect x="580" y="280" width="260" height="48" rx="4"/>
  <rect x="580" y="210" width="260" height="48" rx="4"/>
  <rect x="580" y="140" width="260" height="48" rx="4"/>
</g>
<text x="710" y="381" text-anchor="middle" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">monitor_h</text>
<text x="710" y="311" text-anchor="middle" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">agent_h.ap</text>
<text x="710" y="241" text-anchor="middle" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">predictor</text>
<text x="710" y="171" text-anchor="middle" fill="#f0f0f0" font-size="19" font-family="IBM Plex Mono, ui-monospace, monospace">adapter.bus2reg()</text>

<text x="642" y="442" text-anchor="middle" fill="#74e685" font-size="15">lo que vio el cable</text>

<text x="40" y="530" fill="#8d8d8d" font-size="17">Una sola pieza sabe que abajo hay un APB, y se escribe dos veces: <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#f0f0f0">reg2bus</tspan> baja, <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#f0f0f0">bus2reg</tspan> sube.</text>
<text x="40" y="556" fill="#8d8d8d" font-size="17">Con predicción explícita el espejo cree <tspan fill="#f0f0f0">lo que pasó en el cable</tspan>, no lo que el modelo quiso mandar.</text>
</svg>
