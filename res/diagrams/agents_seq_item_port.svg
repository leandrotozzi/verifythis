<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 462" font-family="IBM Plex Sans, system-ui, sans-serif">
<title>Del par put/get de la unidad 18 al seq_item_port de la unidad 22</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
  </marker>
  <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#e7ad52"/>
  </marker>
</defs>

<!-- ===== unidad 18 ===== -->
<text x="40" y="44" fill="#8d8d8d" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace">unidad 18 · put / get</text>

<rect x="40" y="76" width="200" height="64" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="40" y="76" width="200" height="64" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="140" y="114" fill="#f0f0f0" font-size="20" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">tester_h</text>
<rect x="229" y="97" width="22" height="22" fill="#5b6b7a"/>

<rect x="330" y="68" width="240" height="80" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="330" y="68" width="240" height="80" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="450" y="102" fill="#f0f0f0" font-size="20" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">command_f</text>
<text x="450" y="126" fill="#8d8d8d" font-size="14" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">uvm_tlm_fifo</text>
<circle cx="330" cy="108" r="9" fill="#e7ad52"/>
<circle cx="570" cy="108" r="9" fill="#e7ad52"/>

<rect x="660" y="76" width="200" height="64" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="660" y="76" width="200" height="64" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="760" y="114" fill="#f0f0f0" font-size="20" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">driver_h</text>
<rect x="649" y="97" width="22" height="22" fill="#5b6b7a"/>

<path d="M251,108 H319" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<path d="M645,108 H581" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<text x="285" y="98" fill="#8d8d8d" font-size="14" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">put()</text>
<text x="613" y="98" fill="#8d8d8d" font-size="14" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">get()</text>
<text x="450" y="180" fill="#8d8d8d" font-size="16" text-anchor="middle">tres componentes en el árbol, dos connect(), y ningún aviso de vuelta</text>

<!-- ===== unidad 22 ===== -->
<text x="40" y="222" fill="#e7ad52" font-size="20" font-family="IBM Plex Mono, ui-monospace, monospace">unidad 22 · sequencer</text>

<rect x="40" y="258" width="200" height="64" rx="4" fill="#e7ad52" fill-opacity="0.12"/>
<rect x="40" y="258" width="200" height="64" rx="4" fill="none" stroke="#e7ad52" stroke-width="2"/>
<text x="140" y="290" fill="#e7ad52" font-size="18" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">command_sequence</text>
<text x="140" y="311" fill="#8d8d8d" font-size="14" text-anchor="middle">uvm_object</text>

<rect x="330" y="250" width="240" height="80" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="330" y="250" width="240" height="80" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="450" y="284" fill="#f0f0f0" font-size="20" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">sequencer_h</text>
<text x="450" y="308" fill="#8d8d8d" font-size="14" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">uvm_sequencer</text>
<circle cx="570" cy="290" r="9" fill="#e7ad52"/>

<rect x="660" y="258" width="200" height="64" rx="4" fill="#ffffff" opacity="0.06"/>
<rect x="660" y="258" width="200" height="64" rx="4" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<text x="760" y="296" fill="#f0f0f0" font-size="20" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">driver_h</text>
<rect x="649" y="279" width="22" height="22" fill="#5b6b7a"/>

<path d="M251,290 H319" fill="none" stroke="#e7ad52" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-acc)"/>
<path d="M645,290 H581" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
<text x="285" y="240" fill="#8d8d8d" font-size="14" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">seq.start(sequencer_h)</text>
<text x="613" y="352" fill="#e7ad52" font-size="15" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">get_next_item()</text>
<text x="613" y="374" fill="#e7ad52" font-size="15" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace">item_done()</text>

<text x="450" y="414" fill="#f0f0f0" font-size="18" text-anchor="middle">El sequencer reemplaza a la FIFO y agrega el <tspan font-family="IBM Plex Mono, ui-monospace, monospace" fill="#e7ad52">item_done()</tspan>: el driver avisa cuándo terminó.</text>
<text x="450" y="442" fill="#8d8d8d" font-size="17" text-anchor="middle">La sequence no es un componente: no está en el árbol, no se conecta — se arranca.</text>
</svg>
