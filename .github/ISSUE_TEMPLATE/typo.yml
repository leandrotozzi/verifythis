name: "Typo o error de contenido"
description: "Una palabra mal escrita, un número que no cierra, una explicación que dice algo que no es"
title: "[typo] "
labels: ["contenido"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias. Esto es el aporte más barato de mandar y uno de los más útiles.
        Con que digas **dónde** está alcanza: no hace falta que propongas el arreglo.
  - type: input
    id: donde
    attributes:
      label: ¿Dónde?
      description: "El archivo de `slides/`, el número de slide, o el título que se lee arriba"
      placeholder: "slides/085-13-uvm-environments.md — slide «El override de la factory»"
    validations:
      required: true
  - type: textarea
    id: que
    attributes:
      label: ¿Qué dice, y qué debería decir?
      placeholder: |
        Dice: "el connect_phase corre de arriba hacia abajo"
        Debería decir: "de abajo hacia arriba"
    validations:
      required: true
  - type: checkboxes
    id: donde-lo-viste
    attributes:
      label: ¿Dónde lo estabas leyendo?
      options:
        - label: "En el deck (`curso.html` o `index.html`)"
        - label: "En el libro (`libro/diaN.html`)"
        - label: "En el PDF o el PPTX"
        - label: "En el Markdown, en GitHub"
