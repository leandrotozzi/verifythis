name: "Duda de un ejercicio"
description: "Te trabaste en un ejercicio y las pistas del README no alcanzaron"
title: "[ejercicio] "
labels: ["ejercicio", "pregunta"]
body:
  - type: markdown
    attributes:
      value: |
        Si [Discussions](../../discussions) está prendido, una duda va mejor ahí
        —hay una categoría por día y la respuesta le sirve a más gente—. Pero si
        preferís un issue, éste es el formulario.

        Y antes de escribir: **que te trabes es información**. Si las pistas del
        README no alcanzaron, eso es un bug del ejercicio y quiero saberlo.
  - type: dropdown
    id: cual
    attributes:
      label: ¿Cuál?
      options:
        - "d1 — una operación nueva de punta a punta"
        - "d1b — el mismo DUT, con clocking block"
        - "d2 — un tester que sólo multiplica"
        - "d3 — el override de la factory"
        - "d4 — un subscriber más"
        - "d5 — el scoreboard grita y el DUT está sano"
        - "d5b — medí tu dist"
        - "d6-agents — el agent que sólo mira"
        - "d6-sequences — una sequence que sólo multiplica"
        - "d6-bins — cerrar un bin"
        - "d6-semillas — cinco semillas y un merge"
        - "d7-sva — la property que ve al módulo heredado"
        - "d7-final — el capstone del APB"
        - "d8-fifo — el segundo capstone: una FIFO con backpressure"
        - "d8-ral — modelar el mapa de registros"
    validations:
      required: true
  - type: textarea
    id: donde
    attributes:
      label: ¿Dónde te trabaste?
      description: "Qué probaste y qué te dijo el corrector. El mensaje del `run.sh` completo ayuda."
    validations:
      required: true
  - type: textarea
    id: codigo
    attributes:
      label: Lo que escribiste
      description: "Opcional, pero es lo que hace la diferencia entre adivinar y contestar."
      render: systemverilog
  - type: checkboxes
    id: chequeos
    attributes:
      label: Antes de mandar
      options:
        - label: "Leí las pistas del `README.md` del ejercicio, que están en orden de utilidad"
        - label: "Probé `SOLUCION=1 bash run.sh` y ésa sí pasa"
