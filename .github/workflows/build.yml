name: build

# El deck, el libro, el PDF/PPTX y el sitio. El otro workflow (ejemplos.yml)
# corre el CODIGO.
#
#   push / PR      armar todo + los gates (~4 min)
#   push a master  ademas: publicar en Pages y probar que el sitio ande
#   a mano         ademas: los links externos, que dependen de servers ajenos
#
# Sin cron: nada corre por reloj en este repo.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Por defecto lo minimo. Los permisos de Pages se dan SOLO en el job que
# publica: asi ninguna action de terceros (setup-chrome, pandoc) corre en un job
# que puede firmar un deploy.
permissions:
  contents: read

# Por rama, no global: dos PR abiertos no tienen por que cancelarse entre si.
# La cola de Pages se serializa en el job de deploy, que es donde importa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # El gate barato y el que mas atrapa: que los generados (index.html,
      # libro/, docs/) esten al dia con slides/, y los cuatro linters.
      - name: Generados al dia + linters
        run: npm run check

      - run: npm run build

      - uses: browser-actions/setup-chrome@v1
        id: chrome
      # Falla si alguna slide se recorta, en pantalla o en el PDF
      - name: Ninguna slide recortada
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run overflow

      # Las capturas del README y de la og:image se REGENERAN aca, donde hay
      # Chrome. `npm run check` ya fallo antes si los numeros que muestran
      # quedaron viejos; esto ademas las deja frescas para el sitio que se
      # publica. No se commitean: el PNG de este runner no es byte a byte el de
      # una Mac, y un diff permanente no le sirve a nadie.
      - name: Capturas del deck
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run capturas

      # Los dos idiomas sin condicionales: slides/en/ esta completo (70/70
      # secciones, los 8 dias) desde la fase 15. Si algun dia vuelve a estar a
      # medias, el que se cae es tools/build.mjs, con un mensaje que lo dice.
      - name: PDF
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node tools/pdf.mjs
          node tools/pdf.mjs --lang=en

      - uses: pandoc/actions/setup@v1
      - name: PPTX
        run: |
          node tools/pptx.mjs
          node tools/pptx.mjs --lang=en

      # Chrome sin memoria a la mitad de las 440 paginas deja un PDF de 2 MB que
      # se sube igual. Esto lo mira por adentro: encabezado, cierre, xref y
      # tantas paginas como slides.
      #
      # Y ademas compara el TEXTO del PDF contra los bullets del deck: una slide
      # que necesita mas de una hoja puede perder la cola al paginar, y eso no lo
      # ve ni el --check ni tools/overflow.mjs. poppler-utils trae pdftotext, que
      # es lo unico que hace falta para leerlo; con --exigir el lint falla si no
      # esta, en vez de saltearse en silencio como hace en una maquina cualquiera.
      - name: Instalar pdftotext
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - name: El PDF y el PPTX no salieron truncados, y el PDF dice lo mismo que el deck
        run: |
          npm run lint:dist
          node tools/lint-pdf.mjs --exigir
          node tools/lint-pdf.mjs --exigir --lang=en

      - uses: actions/upload-artifact@v4
        with:
          name: curso-uvm
          path: |
            dist/curso-uvm.pdf
            dist/curso-uvm.pptx
            dist/uvm-course.pdf
            dist/uvm-course.pptx
          if-no-files-found: error

      # El sitio: layout, copias y reescrituras estan en tools/sitio.mjs, que se
      # corre igual en local (`npm run sitio`). Antes eran veinte lineas de sed
      # aca adentro que nadie podia probar antes de pushear. --estricto exige
      # ademas los PDF/PPTX, que en el CI ya se generaron.
      - name: Armar el sitio
        run: node tools/sitio.mjs _site --estricto

      # Pages acepta hasta 1 GB. El riesgo real no es el HTML sino un asset
      # gordo que entra sin que nadie mire: un mp4 en res/, un vendor/ inflado.
      - name: Tamano del sitio
        run: |
          MB=$(du -sm _site | cut -f1)
          echo "_site: ${MB} MB"
          echo "### sitio: ${MB} MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MB" -gt 400 ]; then
            echo "::error::_site pesa ${MB} MB. Algo gordo entro sin querer: revisa res/ y vendor/"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # La cola de Pages: sin cancel-in-progress, que cortar un deploy a la mitad
    # deja el sitio en cualquier estado.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy

  # Hasta hoy el workflow terminaba en verde con el deploy hecho y nadie miraba
  # si el sitio SERVIA. Un 404 en /curso.html o en el libro se descubria cuando
  # alguien abria el link.
  humo:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Las paginas que tienen que responder
        env:
          URL: ${{ needs.deploy.outputs.url }}
        run: |
          set -u
          fallas=0
          for p in "" curso.html libro/dia1.html libro/dia8.html \
                   en/ en/curso.html en/libro/day1.html en/libro/day8.html \
                   curso-uvm.pdf uvm-course.pdf sitemap.xml robots.txt; do
            # Pages tarda unos segundos en propagar el deploy: tres intentos.
            for i in 1 2 3; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' -L "${URL}${p}" || echo 000)
              [ "$code" = 200 ] && break
              sleep 5
            done
            if [ "$code" = 200 ]; then echo "  ok  ${URL}${p}"
            else echo "::error::${URL}${p} devuelve ${code}"; fallas=$((fallas+1)); fi
          done
          # Que responda 200 no alcanza: Pages sirve una 404 propia con 200 en
          # algunos casos. La landing tiene que decir de que es.
          curl -sSL "$URL" | grep -q 'Verify This' \
            || { echo "::error::la raiz responde pero no es la landing del curso"; fallas=$((fallas+1)); }
          exit $fallas

  # Los links a sitios ajenos. Solo a mano, a proposito: que el CI de un PR se
  # ponga rojo porque se cayo el server de otro es la forma mas rapida de que el
  # equipo aprenda a ignorar el CI. continue-on-error deja el aviso en la corrida
  # sin romperla. Se pide con: gh workflow run build.yml --ref master
  enlaces:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/lint-web.mjs --red
