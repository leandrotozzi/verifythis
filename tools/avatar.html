<!doctype html>
<meta charset="utf-8">
<title>Verify This! — avatar</title>
<!--
  El avatar de 500x500 para una cuenta o una organizacion de GitHub. El repo NO
  tiene avatar propio: lo que se ve al lado del nombre es el del owner.
  Ver docs/marca.md.

  Es el mismo dibujo que css/favicon.svg, con UNA diferencia: la marca entra al
  68% y centrada, en vez de tocar los bordes. GitHub recorta el avatar en
  CIRCULO en la mitad de los lugares donde lo muestra --los comentarios, el
  perfil-- y en el favicon el "!" llega hasta x=28 de 32, o sea justo en la
  esquina que el circulo se come. Con el aire, sobrevive a los dos recortes.

  Se rinde con:  npm run social-card   -> docs/avatar.png
-->
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 500px; height: 500px; overflow: hidden; }
  body {
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg { width: 340px; height: 340px; }   /* 68% de 500 */
</style>

<svg viewBox="0 0 32 32" role="img" aria-label="Verify This!">
  <!-- sin el rect de fondo: el #111 lo pone el body, asi el color llega hasta
       el borde y cualquier recorte cae sobre fondo y no sobre blanco -->
  <path d="M5.5 13.5 12.2 23.5 19.8 5.5" fill="none" stroke="#e7ad52" stroke-width="5"
        stroke-linecap="square"/>
  <rect x="23" y="6.8" width="5" height="11.2" fill="#f0f0f0"/>
  <rect x="23" y="20.4" width="5" height="4.8" fill="#f0f0f0"/>
</svg>
